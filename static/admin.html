<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Family Budget</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1116;color:#e8ecf5;font:14px/1.5 -apple-system,sans-serif;padding:16px;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:20px;margin-bottom:14px}
.card{background:#161a22;border:1px solid #242a37;border-radius:12px;padding:20px;max-width:400px;margin:60px auto}
.card input{width:100%;background:#1d222d;color:#e8ecf5;border:1px solid #242a37;border-radius:10px;padding:12px;font:inherit;margin-bottom:12px}
.card button{width:100%;background:#4d9fff;color:#fff;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:700;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;background:#1d222d;border-radius:10px;padding:4px;margin-bottom:16px}
.tab{flex:1;text-align:center;padding:10px;border-radius:8px;font-size:13px;font-weight:600;color:#8a92a4;cursor:pointer}
.tab.active{background:#4d9fff;color:#fff}
.filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filters label{font-size:11px;color:#8a92a4;text-transform:uppercase;letter-spacing:.5px}
.filters input{background:#1d222d;color:#e8ecf5;border:1px solid #242a37;border-radius:8px;padding:8px 10px;font:inherit;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#161a22;border:1px solid #242a37;border-radius:12px;padding:14px}
.stat .lbl{font-size:11px;color:#8a92a4;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.stat .val{font-size:22px;font-weight:900;color:#f5c451}
.stat .val.g{color:#35d07f}
.stat .val.b{color:#4d9fff}
.btn{background:#1d222d;color:#e8ecf5;border:1px solid #242a37;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;font-size:13px}
.btn.primary{background:#4d9fff;border:0;color:#fff}
table{width:100%;border-collapse:collapse;font-size:12px;background:#161a22;border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #242a37}
th{color:#8a92a4;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;position:sticky;top:0;background:#161a22;z-index:5}
tr:last-child td{border:0}
.tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;white-space:nowrap}
.tag.trial{background:rgba(245,196,81,.15);color:#f5c451}
.tag.paid{background:rgba(53,208,127,.15);color:#35d07f}
.tag.expired{background:rgba(255,85,102,.15);color:#ff5566}
.muted{color:#8a92a4;font-size:11px}
.err{background:#3a1218;color:#ff5566;padding:12px;border-radius:10px;margin:12px 0;font-family:monospace;font-size:12px;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal.active{display:flex}
.sheet{background:#161a22;border:1px solid #242a37;border-radius:16px;padding:20px;max-width:400px;width:100%}
.sheet h2{font-size:16px;margin-bottom:14px}
.sheet label{display:block;font-size:11px;color:#8a92a4;text-transform:uppercase;margin-bottom:6px;margin-top:12px}
.sheet input,.sheet select{width:100%;background:#1d222d;color:#e8ecf5;border:1px solid #242a37;border-radius:10px;padding:10px;font:inherit}
.sheet .row{display:flex;gap:8px;margin-top:16px}
.sheet .row button{flex:1;padding:12px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.sheet .row .save{background:#4d9fff;color:#fff}
.sheet .row .cancel{background:#1d222d;color:#e8ecf5;border:1px solid #242a37}
.action{background:#4d9fff;color:#fff;border:0;border-radius:6px;padding:5px 10px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
.scroll{max-height:70vh;overflow:auto;border-radius:12px}
.admin-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px;background:#161a22;border:1px solid #242a37;border-radius:12px;margin:12px 0 16px}.admin-form label{display:flex;flex-direction:column;gap:5px;color:#8a92a4;font-size:11px}.admin-form input,.admin-form select{min-width:0;background:#1d222d;color:#e8ecf5;border:1px solid #30394b;border-radius:9px;padding:10px;font:inherit}.activity-event{padding:9px 11px;border-top:1px solid #242a37;font-size:12px}.activity-event small{display:block;color:#8a92a4;margin-top:3px}.activity-user{background:#161a22;border:1px solid #242a37;border-radius:12px;margin:10px 0;overflow:hidden}.activity-user-head{display:flex;justify-content:space-between;gap:10px;padding:12px;flex-wrap:wrap}.promo-status{font-size:10px;border-radius:20px;padding:3px 8px;background:#173b2c;color:#35d07f}.promo-status.off{background:#3a2528;color:#ff8793}@media(max-width:560px){.tabs{flex-wrap:wrap}.tab{min-width:40%}}</style>
</head>
<body>
<div class="wrap">

<div class="card" id="login">
  <h1>Admin</h1>
  <input type="password" id="pass" placeholder="Пароль">
  <button id="enter">Войти</button>
  <div class="err" id="login-err" style="display:none"></div>
</div>

<div id="panel" style="display:none">
  <div class="top">
    <h1>Family Budget — админка</h1>
    <div>
      <button class="btn" id="refresh">Обновить</button>
      <button class="btn primary" id="export">Excel (CSV)</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="users" onclick="switchTab('users')">👤 Пользователи</div>
    <div class="tab" data-tab="refs" onclick="switchTab('refs')">🎁 Рефералы</div><div class="tab" data-tab="activity" onclick="switchTab('activity')">🕒 Активность</div><div class="tab" data-tab="promos" onclick="switchTab('promos')">🎟️ Промокоды</div>
  </div>

  <div class="stats" id="totals"></div>

<div class="filters">
  <label>Регистрация с</label>
    <input type="date" id="dateFrom">
    <label>по</label>
    <input type="date" id="dateTo">
    <button class="btn" onclick="applyFilters()">Применить</button>
    <button class="btn" onclick="clearFilters()">Сбросить</button>
  </div>

  <div class="stats" id="revenue"></div>
  <div class="stats" id="stats"></div>
  <div class="err" id="err" style="display:none"></div>

  <div class="scroll">
    <div id="table-users"></div>
    <div id="table-refs" style="display:none"></div><div id="table-activity" style="display:none"></div><div id="table-promos" style="display:none"></div>
  </div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyDiDQaNRTcy_YPTqoWsFSDXKnMZ_wEWfU",
  authDomain: "money-family-f9d8b.firebaseapp.com",
  databaseURL: "https://money-family-f9d8b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "money-family-f9d8b",
  storageBucket: "money-family-f9d8b.firebasestorage.app",
  messagingSenderId: "47777538709",
  appId: "1:47777538709:web:11e5bbfb2795b59299f19c"
});
var db = firebase.database();

var ADMIN_PASSWORD = "Max07kolen";
var users = [];
var currentTab = 'users';
var filter = { from: null, to: null };

var TARIFF_NAMES = {
  "trial":"Trial","trial7":"Trial 7 дней",
  "1month":"1 месяц","3months":"3 месяца","6months":"6 месяцев","12months":"12 месяцев",
  "pro1":"Pro 1 мес","pro3":"Pro 3 мес","pro12":"Pro 12 мес","review":"Разбор"
};
var TARIFF_DAYS = {
  "trial":30,"trial7":7,"1month":30,"3months":90,"6months":180,
  "12months":365,"pro1":30,"pro3":90,"pro12":365,"review":0
};

function showErr(id, msg){
  var el = document.getElementById(id);
  el.style.display = "block";
  el.textContent = msg;
}

document.getElementById("enter").onclick = function(){
  if(document.getElementById("pass").value !== ADMIN_PASSWORD){
    showErr("login-err", "Неверный пароль");
    return;
  }
  document.getElementById("login").style.display = "none";
  document.getElementById("panel").style.display = "block";
  load();
};
document.getElementById("refresh").onclick = load;

function load(){
  db.ref("users").once("value").then(function(snap){
    var v = snap.val() || {};
    users = [];
    for(var k in v){
      var u = v[k];
      if(!u || typeof u !== "object") continue;
      u.key = k;
      u.referrals = u.referrals || {};
      users.push(u);
    }
    render();
  }).catch(function(e){
    showErr("err", "DB: " + e.message);
  });
}

function pad(n){ return n < 10 ? "0" + n : "" + n; }
function fmtDate(ts){
  if(!ts) return "—";
  var d = new Date(ts);
  return pad(d.getDate()) + "." + pad(d.getMonth()+1) + "." + d.getFullYear();
}
function daysLeft(ts){
  if(!ts) return 0;
  return Math.ceil((ts - Date.now()) / 86400000);
}
function getStatus(u){
  if(u.status === "expired") return "expired";
  if(!u.subEnd) return "expired";
  if(u.subEnd < Date.now()) return "expired";
  if((u.tariff || "").indexOf("trial") === 0) return "trial";
  return "paid";
}
function getTariffLabel(u){
  var key = u.tariff || "trial";
  return TARIFF_NAMES[key] || key;
}
function isPaidUser(u){
  var s = getStatus(u);
  return s === "paid";
}

function userInRange(u){
  if(!filter.from && !filter.to) return true;
  var first = u.firstSeen || 0;
  if(filter.from && first < filter.from) return false;
  if(filter.to && first > filter.to) return false;
  return true;
}

function switchTab(name){
  currentTab = name;
  document.querySelectorAll('.tab').forEach(function(el){
    el.classList.toggle('active', el.dataset.tab === name);
  });
  ['users','refs','activity','promos'].forEach(function(key){var node=document.getElementById('table-'+key);if(node)node.style.display=name===key?'block':'none';});
  if(name==='activity')loadActivity();else if(name==='promos')loadPromoCodes();else render();
}

function applyFilters(){
  var f = document.getElementById('dateFrom').value;
  var t = document.getElementById('dateTo').value;
  filter.from = f ? new Date(f + 'T00:00:00').getTime() : null;
  filter.to = t ? new Date(t + 'T23:59:59').getTime() : null;
  render();
}
function clearFilters(){
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  filter.from = null;
  filter.to = null;
  render();
}

function renderTotals(){
  var total = users.length;
  var paid = 0;
  var trial = 0;
  var expired = 0;
  var totalRefs = 0;
  var totalPaidRefs = 0;
  var totalRevenue = 0;

  users.forEach(function(u){
    var s = getStatus(u);
    if(s === "trial") trial++;
    else if(s === "expired") expired++;
    else paid++;

    var amount = parseFloat(u.paidAmount) || 0;
    totalRevenue += amount;

    var refs = Object.keys(u.referrals || {});
    totalRefs += refs.length;
    refs.forEach(function(rid){
      var ru = users.find(function(x){ return x.key === rid; });
      if(ru && isPaidUser(ru)) totalPaidRefs++;
    });
  });

  var h = '';
  h += '<div class="stat"><div class="lbl">📦 Всего в базе</div><div class="val b">' + total + '</div></div>';
  h += '<div class="stat"><div class="lbl">💎 Платных</div><div class="val g">' + paid + '</div></div>';
  h += '<div class="stat"><div class="lbl">🎁 Trial</div><div class="val">' + trial + '</div></div>';
  h += '<div class="stat"><div class="lbl">❌ Истекло</div><div class="val">' + expired + '</div></div>';
  h += '<div class="stat"><div class="lbl">👥 Рефералов всего</div><div class="val b">' + totalRefs + '</div></div>';
  h += '<div class="stat"><div class="lbl">✅ Купили из реф.</div><div class="val g">' + totalPaidRefs + '</div></div>';
  h += '<div class="stat"><div class="lbl">💰 Общая выручка</div><div class="val g">' + totalRevenue.toLocaleString() + ' ₴</div></div>';

  document.getElementById('totals').innerHTML = h;
}

function render(){
  renderTotals();
  var filtered = users.filter(userInRange);
  var total = filtered.length;
  var paid = 0, trial = 0, expired = 0;
  filtered.forEach(function(u){
    var s = getStatus(u);
    if(s === "trial") trial++;
    else if(s === "expired") expired++;
    else paid++;
  });

  var totalReferrals = 0;
  var totalPaidRefs = 0;
  filtered.forEach(function(u){
    var refs = Object.keys(u.referrals || {});
    totalReferrals += refs.length;
    refs.forEach(function(rid){
      var ru = users.find(function(x){ return x.key === rid; });
      if(ru && isPaidUser(ru)) totalPaidRefs++;
    });
  });

  var h = '';
  h += '<div class="stat"><div class="lbl">Всего</div><div class="val b">' + total + '</div></div>';
  h += '<div class="stat"><div class="lbl">Платных</div><div class="val g">' + paid + '</div></div>';
  h += '<div class="stat"><div class="lbl">Trial</div><div class="val">' + trial + '</div></div>';
  h += '<div class="stat"><div class="lbl">Истёк</div><div class="val">' + expired + '</div></div>';
  h += '<div class="stat"><div class="lbl">Рефералов</div><div class="val b">' + totalReferrals + '</div></div>';
  h += '<div class="stat"><div class="lbl">Купили из реф.</div><div class="val g">' + totalPaidRefs + '</div></div>';
  document.getElementById('stats').innerHTML = h;
  renderRevenue(filtered);

  if(currentTab === 'users') renderUsersTab(filtered);
  else renderRefsTab(filtered);
}

function renderRevenue(list){
  var now = new Date();
  var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

  var allSum = 0;
  var todaySum = 0;
  var monthSum = 0;
  var allCount = 0;
  var todayCount = 0;
  var monthCount = 0;
  var paidUsers = 0;

  list.forEach(function(u){
    var amount = parseFloat(u.paidAmount) || 0;
    var when = u.subStart || 0;
    if(amount > 0){
      allSum += amount;
      allCount += 1;
      paidUsers += 1;
    }
    if(amount > 0 && when >= todayStart){
      todaySum += amount;
      todayCount += 1;
    }
    if(amount > 0 && when >= monthStart){
      monthSum += amount;
      monthCount += 1;
    }
  });

  var avg = paidUsers > 0 ? Math.round(allSum / paidUsers) : 0;

  var h = '';
  h += '<div class="stat"><div class="lbl">💰 За всё время</div><div class="val g">' + allSum.toLocaleString() + ' ₴</div><div class="muted" style="margin-top:4px">' + allCount + ' оплат</div></div>';
  h += '<div class="stat"><div class="lbl">📅 За этот месяц</div><div class="val b">' + monthSum.toLocaleString() + ' ₴</div><div class="muted" style="margin-top:4px">' + monthCount + ' оплат</div></div>';
  h += '<div class="stat"><div class="lbl">🔥 Сегодня</div><div class="val">' + todaySum.toLocaleString() + ' ₴</div><div class="muted" style="margin-top:4px">' + todayCount + ' оплат</div></div>';
  h += '<div class="stat"><div class="lbl">📊 Средний чек</div><div class="val b">' + avg.toLocaleString() + ' ₴</div></div>';

  document.getElementById('revenue').innerHTML = h;
}
  
function renderUsersTab(list){
  list.sort(function(a,b){ return (b.lastSeen||0) - (a.lastSeen||0); });

  var rows = '';
  list.forEach(function(u){
    var s = getStatus(u);
    var lbl = getTariffLabel(u);
    var dl = daysLeft(u.subEnd);
    var dlTxt = dl > 0 ? (dl + " дн") : "истёк";
    var uname = u.username ? ("@" + u.username) : "—";
    var tgid = u.tgId || u.key || "—";
    var name = u.name || "—";
    var sum = u.paidAmount ? (u.paidAmount + " ₴") : "—";
    var refsCount = Object.keys(u.referrals || {}).length;
    var refBy = u.referredBy || "";

    rows += '<tr>';
    rows += '<td>' + name + '</td>';
    rows += '<td>' + uname + '</td>';
    rows += '<td class="muted">' + tgid + '</td>';
    rows += '<td><span class="tag ' + s + '">' + lbl + '</span></td>';
    rows += '<td>' + sum + '</td>';
    rows += '<td>' + fmtDate(u.subStart) + '</td>';
    rows += '<td>' + fmtDate(u.subEnd) + '</td>';
    rows += '<td>' + dlTxt + '</td>';
    rows += '<td>' + fmtDate(u.firstSeen) + '</td>';
    rows += '<td>' + fmtDate(u.lastSeen) + '</td>';
    rows += '<td>' + (refsCount > 0 ? '<b style="color:#4d9fff">' + refsCount + '</b>' : '—') + '</td>';
    rows += '<td class="muted">' + (refBy ? 'от ' + refBy : '—') + '</td>';
    var c10 = u.couponsEarned || 0;
    var c20 = u.coupons20Earned || 0;
    var cupStr = (c10 > 0 || c20 > 0) ? '<b style="color:#f5c451">' + c10 + '</b>/<b style="color:#35d07f">' + c20 + '</b>' : '—';
    rows += '<td>' + cupStr + '</td>';
    rows += '<td><button class="action" data-key="' + u.key + '">Изм.</button></td>';
    rows += '</tr>';
  });

  document.getElementById('table-users').innerHTML =
    '<table><thead><tr>' +
    '<th>Имя</th><th>Username</th><th>TG ID</th><th>Тариф</th><th>Сумма</th>' +
    '<th>Начало</th><th>Конец</th><th>Осталось</th><th>Регистрация</th><th>Визит</th>' +
    '<th>Реф.</th><th>Кто пригласил</th><th>🎁 10/20</th><th></th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';

  document.querySelectorAll(".action").forEach(function(b){
    b.onclick = function(){ openEdit(b.dataset.key); };
  });
}

function renderRefsTab(list){
  var items = [];
  list.forEach(function(u){
    var refs = Object.keys(u.referrals || {});
    if(refs.length === 0) return;
    var paidCount = 0;
    refs.forEach(function(rid){
      var ru = users.find(function(x){ return x.key === rid; });
      if(ru && isPaidUser(ru)) paidCount++;
    });
    items.push({
      key: u.key,
      name: u.name || "—",
      username: u.username ? ("@" + u.username) : "—",
      count: refs.length,
      paid: paidCount,
      earned: u.couponsEarned || 0,
      earned20: u.coupons20Earned || 0
    });
  });
  items.sort(function(a,b){ return b.count - a.count; });

  if(items.length === 0){
    document.getElementById('table-refs').innerHTML =
      '<div style="padding:30px;text-align:center;color:#8a92a4">Пока никто никого не пригласил</div>';
    return;
  }

  var rows = '';
  items.forEach(function(it, i){
    var conv = it.count > 0 ? Math.round(it.paid / it.count * 100) : 0;
    rows += '<tr>';
    rows += '<td>' + (i+1) + '</td>';
    rows += '<td>' + it.name + '</td>';
    rows += '<td>' + it.username + '</td>';
    rows += '<td><b style="color:#4d9fff">' + it.count + '</b></td>';
    rows += '<td><b style="color:#35d07f">' + it.paid + '</b></td>';
    rows += '<td>' + conv + '%</td>';
    rows += '<td>' + it.earned + ' / ' + it.earned20 + '</td>';
    rows += '<td class="muted">' + it.key + '</td>';
    rows += '</tr>';
  });

  document.getElementById('table-refs').innerHTML =
    '<table><thead><tr>' +
    '<th>#</th><th>Имя</th><th>Username</th><th>Привёл</th><th>Из них купили</th>' +
    '<th>Конверсия</th><th>Купоны 10/20</th><th>TG ID</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
}

/* ====== РЕДАКТОР ТАРИФА ====== */
function openEdit(key){
  var u = users.find(function(x){ return x.key === key; });
  if(!u) return;

  var optionsHtml = '';
  for(var k in TARIFF_NAMES){
    var sel = (u.tariff === k) ? " selected" : "";
    optionsHtml += '<option value="' + k + '"' + sel + '>' + TARIFF_NAMES[k] + '</option>';
  }

  var modal = document.createElement("div");
  modal.className = "modal active";
  modal.innerHTML =
    '<div class="sheet">' +
    '<h2>' + (u.name || "Пользователь") + '</h2>' +
    '<label>Тариф</label>' +
    '<select id="ed-tariff">' + optionsHtml + '</select>' +
    '<label>Сумма оплаты (₴)</label>' +
    '<input type="number" id="ed-amount" value="' + (u.paidAmount || "") + '" placeholder="500">' +
    '<label>Дата окончания</label>' +
    '<input type="date" id="ed-end" value="' + (u.subEnd ? new Date(u.subEnd).toISOString().slice(0,10) : "") + '">' +
    '<div class="row">' +
   '<button class="cancel" data-act="cancel">Отмена</button>' +
   '<button class="save" data-act="save">Сохранить</button>' +
   '</div>' +
   '<div style="display:flex;gap:8px;margin-top:8px">' +
   '<button data-act="c10" style="flex:1;background:#1d222d;color:#f5c451;border:1px solid #242a37;border-radius:10px;padding:10px;cursor:pointer;font-weight:700">🎁 Купон 10%</button>' +
   '<button data-act="c20" style="flex:1;background:#1d222d;color:#35d07f;border:1px solid #242a37;border-radius:10px;padding:10px;cursor:pointer;font-weight:700">🎁 Купон 20%</button>' +
   '</div></div>';
  document.body.appendChild(modal);

  modal.querySelector('[data-act="cancel"]').onclick = function(){ modal.remove(); };
  modal.querySelector('[data-act="c10"]').onclick = function(){
  grantCoupon(u.key, "c10", modal);
};

modal.querySelector('[data-act="c20"]').onclick = function(){
  grantCoupon(u.key, "c20", modal);
};
  modal.querySelector("#ed-tariff").onchange = function(){
    var days = TARIFF_DAYS[this.value] || 30;
    var d = new Date();
    d.setDate(d.getDate() + days);
    modal.querySelector("#ed-end").value = d.toISOString().slice(0,10);
  };

  modal.querySelector('[data-act="save"]').onclick = function(){
    var newTariff = modal.querySelector("#ed-tariff").value;
    var newAmount = parseFloat(modal.querySelector("#ed-amount").value) || 0;
    var newEnd = modal.querySelector("#ed-end").value;

    var upd = {
      tariff: newTariff,
      paidAmount: newAmount,
      status: "active",
      subStart: u.subStart || Date.now(),
      subEnd: newEnd ? new Date(newEnd + "T23:59:59").getTime() : Date.now() + TARIFF_DAYS[newTariff]*86400000
    };

    db.ref("users/" + key).update(upd).then(function(){
      modal.remove();
      load();
    }).catch(function(e){
      alert("Ошибка: " + e.message);
    });
  };
}
var adminApiKey = "";
var API_BASE = "";
function grantCoupon(uid, kind, modal){
  var btn = modal.querySelector('[data-act="' + kind + '"]');
  if(btn){ btn.disabled = true; btn.textContent = "..."; }
  if(!adminApiKey){
    adminApiKey = window.prompt("Введи ADMIN_KEY из настроек Render");
    if(!adminApiKey){ if(btn){ btn.disabled = false; btn.textContent = kind === "c10" ? "🎁 Купон 10%" : "🎁 Купон 20%"; } return; }
  }
  fetch("/api/admin/grant-coupon", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Key": adminApiKey
    },
    body: JSON.stringify({ uid: uid, kind: kind })
  }).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.detail || j.error || ("HTTP " + r.status)); return j; }); }).then(function(j){
    if(j && j.ok){
      alert("Купон " + (kind === "c10" ? "10%" : "20%") + " выдан. Всего: " + j.value);
      modal.remove();
      load();
    } else {
      alert("Ошибка: " + (j && j.error ? j.error : "unknown"));
      if(btn){ btn.disabled = false; btn.textContent = kind === "c10" ? "🎁 Купон 10%" : "🎁 Купон 20%"; }
    }
  }).catch(function(e){
    if(String(e.message).indexOf("ключ администратора") >= 0 || String(e.message).indexOf("401") >= 0){ adminApiKey = ""; }
    alert("Не удалось выдать купон: " + e.message);
    if(btn){ btn.disabled = false; btn.textContent = kind === "c10" ? "🎁 Купон 10%" : "🎁 Купон 20%"; }
  });
  }

function getAdminKey(){
  if(!adminApiKey) adminApiKey=window.prompt("Введи ADMIN_KEY из настроек Render")||"";
  return adminApiKey;
}
function adminFetch(url,options){
  var key=getAdminKey();
  if(!key) return Promise.reject(new Error("Не введён ключ администратора"));
  options=options||{};
  options.headers=Object.assign({},options.headers||{},{"X-Admin-Key":key});
  return fetch(url,options).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.detail||("HTTP "+r.status));return j;});}).catch(function(e){if(String(e.message).includes("401"))adminApiKey="";throw e;});
}
function fmtDateTime(ts){
  if(!ts)return "—";var d=new Date(Number(ts));return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function escapeHtml(v){
  return String(v==null?"":v).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];});
}
function loadActivity(){
  var box=document.getElementById("table-activity");box.innerHTML='<div class="muted">Загружаем активность…</div>';
  adminFetch("/api/admin/activity").then(function(data){
    var users=data.users||[];
    var html='<h2 style="font-size:16px;margin:8px 0">Последняя активность пользователей</h2><div class="muted">Новые события будут записываться после обновления приложения.</div>';
    users.forEach(function(u){
      var events=u.events||[];
      html+='<div class="activity-user"><div class="activity-user-head"><div><b>'+escapeHtml(u.name)+'</b> '+(u.username?'@'+escapeHtml(u.username):'')+'<div class="muted">ID: '+escapeHtml(u.uid)+' · '+escapeHtml(u.tariff)+'</div></div><div><b>'+fmtDateTime(u.lastSeen)+'</b><div class="muted">Последний вход</div></div></div>';
      if(events.length){
        events.forEach(function(ev){
          var d=ev.details||{};
          var label=ev.action==="login"?"Вход в приложение":ev.action==="transaction_added"?"Добавил операцию":ev.action==="transaction_edited"?"Изменил операцию":ev.action==="transaction_deleted"?"Удалил операцию":ev.action;
          var detail=[d.type==="income"?"Доход":d.type==="expense"?"Расход":"",d.title,d.category,d.amount!==undefined?d.amount+" "+(d.currency||""):""].filter(Boolean).join(" · ");
          html+='<div class="activity-event">• '+escapeHtml(label)+'<small>'+fmtDateTime(ev.ts)+(detail?' · '+escapeHtml(detail):'')+'</small></div>';
        });
      }else html+='<div class="activity-event muted">Подробных действий пока нет</div>';
      html+='</div>';
    });
    box.innerHTML=html;
  }).catch(function(e){box.innerHTML='<div class="err">'+escapeHtml(e.message)+'</div>';});
}
function loadPromoCodes(){
  var box=document.getElementById("table-promos");
  box.innerHTML='<h2 style="font-size:16px;margin:8px 0">Создать промокод</h2><div class="admin-form"><label>Код<input id="promo-code" placeholder="WELCOME2026" maxlength="32"></label><label>Награда<select id="promo-reward"><option value="c10">Купон 10%</option><option value="c20">Купон 20%</option></select></label><label>Количество активаций<input id="promo-limit" type="number" min="0" placeholder="0 — без лимита"></label><label>Действует до<input id="promo-expiry" type="date"></label><button class="btn primary" id="promo-create">Создать промокод</button></div><div id="promo-list" class="muted">Загружаем…</div>';
  document.getElementById("promo-create").onclick=function(){
    var payload={code:document.getElementById("promo-code").value,reward:document.getElementById("promo-reward").value,maxUses:document.getElementById("promo-limit").value||0,expiresAt:document.getElementById("promo-expiry").value};
    adminFetch("/api/admin/promo-codes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(function(){alert("Промокод создан");loadPromoCodes();}).catch(function(e){alert("Не удалось создать промокод: "+e.message);});
  };
  adminFetch("/api/admin/promo-codes").then(function(data){
    var codes=data.codes||[];var html='<h2 style="font-size:16px;margin:16px 0 8px">Созданные промокоды</h2>';
    if(!codes.length)html+='<div class="muted">Пока промокодов нет</div>';
    codes.forEach(function(p){
      html+='<div class="activity-user"><div class="activity-user-head"><div><b>'+escapeHtml(p.code)+'</b><div class="muted">'+(p.reward==="c10"?"Купон 10%":"Купон 20%")+' · Использовано '+Number(p.uses||0)+' / '+(Number(p.maxUses||0)||"∞")+' · До '+(p.expiresAt?fmtDate(p.expiresAt):"без срока")+'</div></div><div><span class="promo-status '+(p.enabled?"":"off")+'">'+(p.enabled?"Активен":"Отключён")+'</span> <button class="action promo-toggle" data-code="'+escapeHtml(p.code)+'">'+(p.enabled?"Отключить":"Включить")+'</button></div></div></div>';
    });
    document.getElementById("promo-list").innerHTML=html;
    document.querySelectorAll(".promo-toggle").forEach(function(btn){btn.onclick=function(){adminFetch("/api/admin/promo-codes/"+encodeURIComponent(btn.dataset.code)+"/toggle",{method:"POST"}).then(loadPromoCodes).catch(function(e){alert(e.message);});};});
  }).catch(function(e){document.getElementById("promo-list").innerHTML='<div class="err">'+escapeHtml(e.message)+'</div>';});
}

document.getElementById("export").onclick = function(){
  var filtered = users.filter(userInRange);
  if(!filtered.length){ alert("Нет данных"); return; }
  var rows = [["Имя","Username","TG ID","Тариф","Сумма","Начало","Конец","Осталось дней","Первый визит","Последний визит","Статус","Рефералов","Кто пригласил"]];
  filtered.forEach(function(u){
    rows.push([
      u.name || "",
      u.username || "",
      u.tgId || u.key || "",
      getTariffLabel(u),
      u.paidAmount || "",
      fmtDate(u.subStart),
      fmtDate(u.subEnd),
      daysLeft(u.subEnd),
      fmtDate(u.firstSeen),
      fmtDate(u.lastSeen),
      getStatus(u),
      Object.keys(u.referrals || {}).length,
      u.referredBy || ""
    ]);
  });
  var csv = rows.map(function(row){
    return row.map(function(x){ return '"' + String(x).replace(/"/g,'""') + '"'; }).join(",");
  }).join("\n");
  var blob = new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "users-" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
};
