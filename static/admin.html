<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin test</title>
<style>
body{background:#0f1116;color:#e8ecf5;font:14px/1.5 monospace;padding:20px;margin:0}
.box{background:#161a22;border:1px solid #242a37;border-radius:10px;padding:14px;margin-bottom:10px;word-break:break-all}
.ok{color:#35d07f}
.err{color:#ff5566}
.warn{color:#f5c451}
input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #242a37;background:#1d222d;color:#e8ecf5;margin-right:6px}
button{background:#4d9fff;border:0;font-weight:700;cursor:pointer;color:#fff}
</style></head>
<body>

<div class="box ok" id="step1">1. HTML загрузился</div>
<div class="box warn" id="step2">2. Жду Firebase SDK...</div>
<div class="box warn" id="step3">3. Жду инициализацию...</div>
<div class="box warn" id="step4">4. Проверка DB...</div>

<div class="box">
  <input type="password" id="pass" placeholder="пароль">
  <button id="enter">Войти</button>
</div>

<div class="box" id="result">результат...</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
window.onerror = function(m, s, l, c){
  var r = document.getElementById("result");
  if(r) r.innerHTML += '<div class="err">JS ERROR: ' + m + ' @ ' + l + ':' + c + '</div>';
};

var s2 = document.getElementById("step2");
if(typeof firebase !== "undefined"){
  s2.textContent = "2. Firebase SDK OK — " + typeof firebase.app;
  s2.className = "box ok";
}else{
  s2.textContent = "2. Firebase SDK НЕ загрузился";
  s2.className = "box err";
}

var s3 = document.getElementById("step3");
var s4 = document.getElementById("step4");
var db = null;

try {
  firebase.initializeApp({
    apiKey: "AIzaSyDiDQaNRTcy_YPTqoWsFSDXKnMZ_wEWfU",
    authDomain: "money-family-f9d8b.firebaseapp.com",
    databaseURL: "https://money-family-f9d8b-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "money-family-f9d8b",
    storageBucket: "money-family-f9d8b.firebasestorage.app",
    messagingSenderId: "47777538709",
    appId: "1:47777538709:web:11e5bbfb2795b59299f19c"
  });
  db = firebase.database();
  s3.textContent = "3. Firebase инициализирован, DB доступна";
  s3.className = "box ok";
} catch(e) {
  s3.textContent = "3. ОШИБКА init: " + e.message;
  s3.className = "box err";
}

if(db){
  db.ref("users").once("value").then(function(snap){
    var v = snap.val();
    if(v){
      s4.textContent = "4. DB читается. Пользователей: " + Object.keys(v).length;
    }else{
      s4.textContent = "4. DB пустая (нет пользователей)";
    }
    s4.className = "box ok";
  }).catch(function(e){
    s4.textContent = "4. ОШИБКА чтения DB: " + e.message;
    s4.className = "box err";
  });
}

document.getElementById("enter").onclick = function(){
  var p = document.getElementById("pass").value;
  document.getElementById("result").innerHTML = "Нажал с паролем: [" + p + "]<br>длина: " + p.length;
};
</script>
</body></html>
