<!doctype html>
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1116">
<title>Family Budget</title>
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="topbar">
  <div class="month-nav">
    <button id="prev">‹</button>
    <div class="label" id="mlabel">—</div>
    <button id="next">›</button>
  </div>
  <div class="balance-label">Баланс месяца</div>
  <div class="balance" id="bal">0</div>
  <div class="summary">
    <div class="summary-box income"><div class="lbl">Доходы</div><div class="val" id="sum-in">0</div></div>
    <div class="summary-box expense"><div class="lbl">Расходы</div><div class="val" id="sum-ex">0</div></div>
  </div>
</div>

<div class="tabs">
  <div class="tab on" data-v="list">📋 Записи</div>
  <div class="tab" data-v="env">💰 Конверты</div>
  <div class="tab" data-v="stats">📊 Стата</div>
</div>

<div class="view on" id="v-list"><div class="list" id="list"></div></div>
<div class="view" id="v-env"><div class="env-list" id="env-list"></div></div>
<div class="view" id="v-stats">
  <div class="stat-block"><h3>Топ категорий за месяц</h3><div id="stats-cats"></div></div>
</div>

<button class="fab" id="fab">+</button>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.from(document.querySelectorAll(s))};

var KEY="fb_data_v1";
var state={records:[],envelopes:{},viewMonth:null};

try{
  var saved=JSON.parse(localStorage.getItem(KEY)||"{}");
  if(saved.records)state.records=saved.records;
  if(saved.envelopes)state.envelopes=saved.envelopes;
}catch(e){}

if(!state.viewMonth){
  var n=new Date();
  state.viewMonth=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");
}

function save(){localStorage.setItem(KEY,JSON.stringify({records:state.records,envelopes:state.envelopes}))}

var MONTHS=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];

var INCOME=[
  {id:"salary",name:"Зарплата",e:"💼"},
  {id:"freel",name:"Фриланс",e:"💻"},
  {id:"gift_in",name:"Подарок",e:"🎁"},
  {id:"invest",name:"Инвестиции",e:"📈"},
  {id:"cashback",name:"Кэшбэк",e:"💵"},
  {id:"other_in",name:"Другое",e:"💰"}
];

var EXPENSE=[
  {id:"food",name:"Продукты",e:"🍔"},
  {id:"delivery",name:"Доставка",e:"🛵"},
  {id:"coffee",name:"Кофе/снеки",e:"☕"},
  {id:"rent",name:"Аренда",e:"🏠"},
  {id:"util",name:"Коммуналка",e:"💡"},
  {id:"transp",name:"Транспорт",e:"🚌"},
  {id:"taxi",name:"Такси",e:"🚕"},
  {id:"fuel",name:"Бензин",e:"⛽"},
  {id:"health",name:"Здоровье",e:"💊"},
  {id:"doctor",name:"Врачи",e:"🏥"},
  {id:"fun",name:"Развлечения",e:"🎮"},
  {id:"clothes",name:"Одежда",e:"👕"},
  {id:"kids",name:"Дети",e:"🧒"},
  {id:"pets",name:"Животные",e:"🐕"},
  {id:"online",name:"Онлайн-покупки",e:"🛒"},
  {id:"subs",name:"Подписки",e:"📺"},
  {id:"credit",name:"Кредиты",e:"💳"},
  {id:"repair",name:"Ремонт/дом",e:"🔧"},
  {id:"travel",name:"Путешествия",e:"✈️"},
  {id:"edu",name:"Образование",e:"📚"},
  {id:"beauty",name:"Красота",e:"💅"},
  {id:"sport",name:"Спорт",e:"🏋️"},
  {id:"gift",name:"Подарки",e:"🎀"},
  {id:"tech",name:"Техника",e:"📱"},
  {id:"vape",name:"Вейп/сигареты",e:"💨"},
  {id:"party",name:"Праздники",e:"🎉"},
  {id:"tax",name:"Налоги",e:"📋"},
  {id:"bank",name:"Банк/комиссии",e:"🏦"},
  {id:"other_ex",name:"Другое",e:"📦"}
];

var ALL=INCOME.concat(EXPENSE);
function findCat(id){return ALL.find(function(c){return c.id===id})||{id:id,name:"?",e:"❓"}}
function fmt(n){var a=Math.abs(n);var s=a.toFixed(2).replace(/\.00$/,"");return (n<0?"-":"")+s}

function toast(msg,cls){
  var el=$("#toast");el.textContent=msg;el.className="toast show "+(cls||"");
  clearTimeout(toast._t);toast._t=setTimeout(function(){el.className="toast "+(cls||"")},1800);
}
function monthLabel(ym){return MONTHS[parseInt(ym.split("-")[1])-1]+" "+ym.split("-")[0]}
function shiftMonth(ym,d){
  var p=ym.split("-"),y=parseInt(p[0]),m=parseInt(p[1])-1+d;
  while(m<0){m+=12;y--}while(m>11){m-=12;y++}
  return y+"-"+String(m+1).padStart(2,"0");
}
function recordsOfMonth(ym){return state.records.filter(function(r){return r.date.startsWith(ym)})}

function render(){
  var ym=state.viewMonth;
  var recs=recordsOfMonth(ym);
  var inc=0,ex=0;
  recs.forEach(function(r){if(r.type==="income")inc+=r.amount;else ex+=r.amount});
  var bal=inc-ex;

  $("#mlabel").textContent=monthLabel(ym);
  $("#bal").textContent=fmt(bal);
  $("#bal").className="balance "+(bal>0?"pos":bal<0?"neg":"");
  $("#sum-in").textContent=fmt(inc);
  $("#sum-ex").textContent=fmt(ex);

  var sorted=recs.slice().sort(function(a,b){return (b.ts||0)-(a.ts||0)});
  var list=$("#list");
  if(!sorted.length){
    list.innerHTML='<div class="empty">Записей нет<br><br>Нажми <b>+</b> чтобы добавить</div>';
  }else{
    list.innerHTML=sorted.map(function(r){
      var c=findCat(r.cat);
      var sign=r.type==="income"?"+":"−";
      return '<div class="rec" data-id="'+r.id+'">'
        +'<div class="ico">'+c.e+'</div>'
        +'<div class="info">'
        +'<div class="name">'+(r.note||c.name)+'</div>'
        +'<div class="date">'+c.name+' · '+r.date.split("-").reverse().join(".")+'</div>'
        +'</div>'
        +'<div class="amt '+r.type+'">'+sign+fmt(r.amount)+'</div>'
        +'</div>';
    }).join("");
  }
  renderEnvelopes(recs);
  renderStats(recs);
}

function renderEnvelopes(recs){
  var el=$("#env-list");
  var keys=Object.keys(state.envelopes);
  if(!keys.length){
    el.innerHTML='<div class="empty">Нет конвертов<br><br>Нажми <b>+</b> чтобы добавить бюджет по теме</div>';
    return;
  }
  var byCat={};
  recs.filter(function(r){return r.type==="expense"}).forEach(function(r){
    byCat[r.cat]=(byCat[r.cat]||0)+r.amount;
  });
  el.innerHTML=keys.map(function(catId){
    var lim=state.envelopes[catId];
    var spent=byCat[catId]||0;
    var left=lim-spent;
    var pct=lim>0?Math.min(100,spent/lim*100):0;
    var cls=spent>lim?"over":(pct>=80?"warn":"");
    var c=findCat(catId);
    return '<div class="env '+cls+'">'
      +'<div class="env-head">'
      +'<div class="env-name"><span class="e">'+c.e+'</span>'+c.name+'</div>'
      +'<button class="env-edit" data-cat="'+catId+'">✏️</button>'
      +'</div>'
      +'<div class="env-nums">израсходовано <b>'+fmt(spent)+'</b> из '+fmt(lim)+' · осталось <b>'+fmt(left)+'</b></div>'
      +'<div class="env-bar"><i style="width:'+pct+'%"></i></div>'
      +'</div>';
  }).join("");
  el.querySelectorAll(".env-edit").forEach(function(b){
    b.onclick=function(){editEnvelope(b.dataset.cat)};
  });
}

function renderStats(recs){
  var ex=recs.filter(function(r){return r.type==="expense"});
  var total=ex.reduce(function(s,r){return s+r.amount},0);
  var byCat={};
  ex.forEach(function(r){byCat[r.cat]=(byCat[r.cat]||0)+r.amount});
  var cats=Object.entries(byCat).sort(function(a,b){return b[1]-a[1]}).slice(0,10);
  var el=$("#stats-cats");
  if(!cats.length){
    el.innerHTML='<div style="color:var(--muted);font-size:13px">нет расходов</div>';
  }else{
    el.innerHTML=cats.map(function(kv){
      var c=findCat(kv[0]);
      var pct=total>0?(kv[1]/total*100):0;
      return '<div class="cat-row"><div class="ico">'+c.e+'</div>'
        +'<div class="name">'+c.name+' <span style="color:var(--muted);font-size:11px">'+pct.toFixed(0)+'%</span></div>'
        +'<div class="val">'+fmt(kv[1])+'</div></div>';
    }).join("");
  }
}

$$(".tab").forEach(function(t){
  t.onclick=function(){
    $$(".tab").forEach(function(x){x.classList.remove("on")});
    $$(".view").forEach(function(x){x.classList.remove("on")});
    t.classList.add("on");
    document.getElementById("v-"+t.dataset.v).classList.add("on");
  };
});

$("#prev").onclick=function(){state.viewMonth=shiftMonth(state.viewMonth,-1);render()};
$("#next").onclick=function(){state.viewMonth=shiftMonth(state.viewMonth,+1);render()};

/* ========== МОДАЛКА ЗАПИСИ ========== */
var modal=null;
var edit={type:"expense",cat:"food",amount:"",note:"",date:"",id:null};

function today(){return new Date().toISOString().slice(0,10)}

function openRecord(existing){
  if(existing){
    edit={type:existing.type,cat:existing.cat,amount:String(existing.amount),note:existing.note||"",date:existing.date,id:existing.id};
  }else{
    edit={type:"expense",cat:"food",amount:"",note:"",date:today(),id:null};
  }
  renderRecordModal();
}

function renderRecordModal(){
  if(modal)modal.remove();
  modal=document.createElement("div");
  modal.className="modal";
  var cats=edit.type==="income"?INCOME:EXPENSE;
  modal.innerHTML='<div class="sheet">'
    +'<h2>'+(edit.id?"Изменить":"Новая запись")+'</h2>'
    +'<div class="type-switch">'
    +'<button class="'+(edit.type==="expense"?"on expense":"")+'" data-t="expense">− Расход</button>'
    +'<button class="'+(edit.type==="income"?"on income":"")+'" data-t="income">+ Доход</button>'
    +'</div>'
    +'<div class="field"><label>Сумма</label>'
    +'<input type="number" inputmode="decimal" step="0.01" id="m-am" class="amount-input" placeholder="0" value="'+edit.amount+'"></div>'
    +'<div class="field"><label>Категория</label><div class="cat-grid">'
    +cats.map(function(c){
      return '<div class="cat '+(edit.cat===c.id?"on":"")+'" data-cat="'+c.id+'">'
        +'<span class="e">'+c.e+'</span>'+c.name+'</div>';
    }).join("")
    +'</div></div>'
    +'<div class="field"><label>Комментарий</label>'
    +'<input type="text" id="m-note" placeholder="необязательно" value="'+(edit.note||"").replace(/"/g,"&quot;")+'"></div>'
    +'<div class="field"><label>Дата</label>'
    +'<input type="date" id="m-date" value="'+edit.date+'"></div>'
    +'<div class="row-btns">'
    +(edit.id?'<button class="btn-delete" data-act="del">Удалить</button>':'')
    +'<button class="btn-cancel" data-act="cancel">Отмена</button>'
    +'<button class="btn-primary" data-act="save">Сохранить</button>'
    +'</div></div>';
  document.body.appendChild(modal);
  attachRecordEvents();
}

function attachRecordEvents(){
  modal.querySelectorAll(".type-switch button").forEach(function(b){
    b.onclick=function(){
      edit.type=b.dataset.t;
      edit.cat=(edit.type==="income"?INCOME[0].id:EXPENSE[0].id);
      edit.amount=modal.querySelector("#m-am").value;
      edit.note=modal.querySelector("#m-note").value;
      renderRecordModal();
    };
  });
  modal.querySelectorAll(".cat").forEach(function(c){
    c.onclick=function(){
      edit.cat=c.dataset.cat;
      modal.querySelectorAll(".cat").forEach(function(x){x.classList.remove("on")});
      c.classList.add("on");
    };
  });
  modal.querySelectorAll("[data-act]").forEach(function(b){
    b.onclick=function(){
      var act=b.dataset.act;
      if(act==="cancel"){modal.remove();modal=null;return}
      if(act==="del"){
        state.records=state.records.filter(function(r){return r.id!==edit.id});
        save();render();modal.remove();modal=null;toast("Удалено");return;
      }
      if(act==="save"){
        var amt=parseFloat(modal.querySelector("#m-am").value);
        if(!amt||amt<=0){toast("Введи сумму","err");return}
        var note=modal.querySelector("#m-note").value.trim();
        var date=modal.querySelector("#m-date").value||today();
        if(edit.id){
          var r=state.records.find(function(x){return x.id===edit.id});
          if(r){r.amount=amt;r.note=note;r.date=date;r.type=edit.type;r.cat=edit.cat}
        }else{
          state.records.push({
            id:Date.now()+"-"+Math.random().toString(36).slice(2,8),
            type:edit.type,cat:edit.cat,amount:amt,note:note,date:date,ts:Date.now()
          });
        }
        save();
        var ym=date.slice(0,7);
        if(ym!==state.viewMonth)state.viewMonth=ym;
        render();modal.remove();modal=null;toast("Сохранено","ok");
      }
    };
  });
  modal.onclick=function(e){if(e.target===modal){modal.remove();modal=null}};
}

/* ========== МОДАЛКА КОНВЕРТА ========== */
function editEnvelope(catId){
  if(modal)modal.remove();
  modal=document.createElement("div");
  modal.className="modal";
  var isNew=!catId;
  var current=catId?state.envelopes[catId]:"";
  modal.innerHTML='<div class="sheet">'
    +'<h2>'+(isNew?"Новый конверт":"Изменить конверт")+'</h2>'
    +(isNew?('<div class="field"><label>Категория</label><div class="cat-grid">'
      +EXPENSE.map(function(c){
        return '<div class="cat" data-cat="'+c.id+'"><span class="e">'+c.e+'</span>'+c.name+'</div>';
      }).join("")+'</div></div>'):'')
    +'<div class="field"><label>Лимит на месяц</label>'
    +'<input type="number" inputmode="decimal" step="1" id="m-lim" class="amount-input" placeholder="0" value="'+current+'"></div>'
    +'<div class="row-btns">'
    +(isNew?'':'<button class="btn-delete" data-act="del">Удалить</button>')
    +'<button class="btn-cancel" data-act="cancel">Отмена</button>'
    +'<button class="btn-primary" data-act="save">Сохранить</button>'
    +'</div></div>';
  document.body.appendChild(modal);
  var chosenCat=catId||null;
  modal.querySelectorAll(".cat").forEach(function(c){
    c.onclick=function(){
      chosenCat=c.dataset.cat;
      modal.querySelectorAll(".cat").forEach(function(x){x.classList.remove("on")});
      c.classList.add("on");
    };
  });
  modal.querySelectorAll("[data-act]").forEach(function(b){
    b.onclick=function(){
      var act=b.dataset.act;
      if(act==="cancel"){modal.remove();modal=null;return}
      if(act==="del"){
        delete state.envelopes[catId];
        save();render();modal.remove();modal=null;toast("Удалено");return;
      }
      if(act==="save"){
        var lim=parseFloat(modal.querySelector("#m-lim").value);
        if(!lim||lim<=0){toast("Введи лимит","err");return}
        if(!chosenCat){toast("Выбери категорию","err");return}
        state.envelopes[chosenCat]=lim;
        save();render();modal.remove();modal=null;toast("Сохранено","ok");
      }
    };
  });
  modal.onclick=function(e){if(e.target===modal){modal.remove();modal=null}};
}

$("#fab").onclick=function(){
  if($("#v-env").classList.contains("on")){
    editEnvelope(null);
  }else{
    openRecord();
  }
};

$("#list").addEventListener("click",function(e){
  var rec=e.target.closest(".rec");
  if(!rec)return;
  var existing=state.records.find(function(r){return r.id===rec.dataset.id});
  if(existing)openRecord(existing);
});

render();

var tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand()}

})();
</script>
</body>
</html>
