<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Budget</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Подключение файла стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Шапка -->
        <div class="header">
            <div class="user-profile">
                <div class="user-avatar" id="userAvatar">U</div>
                <div>
                    <h3 id="userName" style="margin:0; font-size: 16px;" data-i18n="user_default">Пользователь</h3>
                    <p id="subStatusText" style="margin:0; font-size: 12px; color: var(--text-muted);" data-i18n="sub_active">Подписка: Активна</p>
                </div>
            </div>
            <button class="opt-btn" onclick="switchTab('settings')"><i class="fa-solid fa-gear"></i></button>
        </div>

        <!-- Баланс -->
        <div class="balance-card">
            <div style="font-size: 12px; color: var(--text-muted);" data-i18n="main_balance">Основной баланс</div>
            <div class="balance-amount" id="totalBalance">0 ₴</div>
            <div class="balance-stats">
                <div>
                    <div style="font-size: 11px; color: var(--text-muted);" data-i18n="month_income">Доходы за месяц</div>
                    <div class="stat-value income" id="monthIncome">+0 ₴</div>
                </div>
                <div>
                    <div style="font-size: 11px; color: var(--text-muted);" data-i18n="month_expense">Расходы за месяц</div>
                    <div class="stat-value expense" id="monthExpense">-0 ₴</div>
                </div>
            </div>
        </div>

        <!-- Кнопки Расход и Доход -->
        <div class="grid-2">
            <button class="btn-square" style="background: var(--danger-color);" onclick="openTransactionModal('expense')">
                <i class="fa-solid fa-circle-minus"></i> <span data-i18n="btn_expense">Расход</span>
            </button>
            <button class="btn-square" style="background: var(--success-color);" onclick="openTransactionModal('income')">
                <i class="fa-solid fa-circle-plus"></i> <span data-i18n="btn_income">Доход</span>
            </button>
        </div>

        <!-- Вкладка 1: Бюджет -->
        <div id="tab-budget" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h4 style="margin:0;" data-i18n="envelope_title">Конверты расходов</h4>
                <button class="btn-square" style="background: var(--accent-color);" onclick="openModal('modalAddEnvelope')">
                    <i class="fa-solid fa-plus"></i> <span data-i18n="btn_create">Создать</span>
                </button>
            </div>
            <div id="envelopesList"></div>
        </div>

        <!-- Вкладка 2: Банки -->
        <div id="tab-banks" class="tab-content" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h4 style="margin:0;" data-i18n="banks_title">Банки и Накопления</h4>
                <button class="btn-square" style="background: var(--accent-color);" onclick="openModal('modalAddBank')">
                    <i class="fa-solid fa-piggy-bank"></i> <span data-i18n="btn_new_bank">Новая банка</span>
                </button>
            </div>
            <div id="banksList"></div>
        </div>

        <!-- Вкладка 3: Аналитика -->
        <div id="tab-analytics" class="tab-content" style="display: none;">
            <h4 style="margin-top: 0;" data-i18n="analytics_title">Аналитика расходов</h4>
            <div style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-square); padding: 16px;">
                <canvas id="expensesChart" height="200"></canvas>
            </div>
        </div>

        <!-- Вкладка 4: Настройки -->
        <div id="tab-settings" class="tab-content" style="display: none;">
            <h4 style="margin-top: 0;" data-i18n="settings_title">⚙️ Настройки</h4>

            <!-- Выбор Языка -->
            <div style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-square); padding: 12px; margin-bottom: 12px;">
                <label style="font-size: 12px; color: var(--text-muted);" data-i18n="select_language">Язык интерфейса:</label>
                <div class="grid-selector">
                    <button class="opt-btn" onclick="changeLanguage('ru')">Русский</button>
                    <button class="opt-btn" onclick="changeLanguage('uk')">Українська</button>
                    <button class="opt-btn" onclick="changeLanguage('en')">English</button>
                    <button class="opt-btn" onclick="changeLanguage('es')">Español</button>
                    <button class="opt-btn" onclick="changeLanguage('de')">Deutsch</button>
                    <button class="opt-btn" onclick="changeLanguage('fr')">Français</button>
                    <button class="opt-btn" onclick="changeLanguage('pl')">Polski</button>
                </div>
            </div>

            <!-- Выбор Валюты -->
            <div style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-square); padding: 12px; margin-bottom: 12px;">
                <label style="font-size: 12px; color: var(--text-muted);" data-i18n="select_currency">Основная валюта:</label>
                <div class="grid-selector">
                    <button class="opt-btn" onclick="setCurrency('UAH')">UAH (₴)</button>
                    <button class="opt-btn" onclick="setCurrency('RUB')">RUB (₽)</button>
                    <button class="opt-btn" onclick="setCurrency('USD')">USD ($)</button>
                    <button class="opt-btn" onclick="setCurrency('EUR')">EUR (€)</button>
                    <button class="opt-btn" onclick="setCurrency('PLN')">PLN (zł)</button>
                    <button class="opt-btn" onclick="setCurrency('KZT')">KZT (₸)</button>
                    <button class="opt-btn" onclick="setCurrency('GBP')">GBP (£)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="nav-bar">
        <div class="nav-item active" id="nav-budget" onclick="switchTab('budget')"><i class="fa-solid fa-wallet"></i><span data-i18n="nav_budget">Бюджет</span></div>
        <div class="nav-item" id="nav-banks" onclick="switchTab('banks')"><i class="fa-solid fa-vault"></i><span data-i18n="nav_banks">Банки</span></div>
        <div class="nav-item" id="nav-analytics" onclick="switchTab('analytics')"><i class="fa-solid fa-chart-pie"></i><span data-i18n="nav_analytics">Аналитика</span></div>
        <div class="nav-item" id="nav-settings" onclick="switchTab('settings')"><i class="fa-solid fa-sliders"></i><span data-i18n="nav_settings">Настройки</span></div>
    </div>

    <!-- Модальное окно: Транзакция (Расход/Доход) -->
    <div class="modal" id="modalTransaction">
        <div class="modal-content">
            <h3 style="margin-top:0;" id="txModalTitle">Добавить операцию</h3>
            <label style="font-size: 12px; color: var(--text-muted);">Сумма</label>
            <input type="number" id="txAmountInput" class="custom-input" placeholder="0">
            
            <div id="txEnvelopeGroup">
                <label style="font-size: 12px; color: var(--text-muted);">Конверт</label>
                <select id="txEnvelopeSelect" class="custom-input"></select>
            </div>

            <button class="btn-square" style="width: 100%; background: var(--accent-color);" onclick="submitTransaction()">Сохранить</button>
            <button class="btn-square" style="width: 100%; background: transparent; color: var(--text-muted); margin-top: 6px;" onclick="closeModal('modalTransaction')">Отмена</button>
        </div>
    </div>

    <!-- Модальное окно: Создать конверт -->
    <div class="modal" id="modalAddEnvelope">
        <div class="modal-content">
            <h3 style="margin-top:0;" data-i18n="modal_add_envelope">Создать конверт</h3>
            <label style="font-size: 12px; color: var(--text-muted);" data-i18n="label_name">Название</label>
            <input type="text" id="envNameInput" class="custom-input" placeholder="Продукты, Связь...">
            <label style="font-size: 12px; color: var(--text-muted);" data-i18n="label_target">Лимит</label>
            <input type="number" id="envTargetInput" class="custom-input" placeholder="1000">
            <button class="btn-square" style="width: 100%; background: var(--accent-color);" onclick="saveEnvelope()" data-i18n="btn_save">Сохранить</button>
            <button class="btn-square" style="width: 100%; background: transparent; color: var(--text-muted); margin-top: 6px;" onclick="closeModal('modalAddEnvelope')">Отмена</button>
        </div>
    </div>

    <!-- Модальное окно: Создать банку -->
    <div class="modal" id="modalAddBank">
        <div class="modal-content">
            <h3 style="margin-top:0;" data-i18n="modal_add_bank">Новая банка</h3>
            <label style="font-size: 12px; color: var(--text-muted);" data-i18n="label_name">Название цели</label>
            <input type="text" id="bankNameInput" class="custom-input" placeholder="Новый телефон...">
            <label style="font-size: 12px; color: var(--text-muted);" data-i18n="label_target">Цель накопления</label>
            <input type="number" id="bankTargetInput" class="custom-input" placeholder="5000">
            <button class="btn-square" style="width: 100%; background: var(--accent-color);" onclick="saveBank()" data-i18n="btn_save">Сохранить</button>
            <button class="btn-square" style="width: 100%; background: transparent; color: var(--text-muted); margin-top: 6px;" onclick="closeModal('modalAddBank')">Отмена</button>
        </div>
    </div>

    <!-- Скрипт приложения -->
    <script>
        const CURRENCY_SYMBOLS = { UAH: '₴', RUB: '₽', USD: '$', EUR: '€', PLN: 'zł', KZT: '₸', GBP: '£' };

        const I18N = {
            ru: { user_default: "Пользователь", sub_active: "Подписка: Активна", main_balance: "Основной баланс", month_income: "Доходы за месяц", month_expense: "Расходы за месяц", btn_expense: "Расход", btn_income: "Доход", envelope_title: "Конверты расходов", btn_create: "Создать", banks_title: "Банки и Накопления", btn_new_bank: "Новая банка", analytics_title: "Аналитика расходов", settings_title: "⚙️ Настройки", select_language: "Язык интерфейса:", select_currency: "Основная валюта:", nav_budget: "Бюджет", nav_banks: "Банки", nav_analytics: "Аналитика", nav_settings: "Настройки", modal_add_envelope: "Создать конверт", modal_add_bank: "Новая банка", label_name: "Название", label_target: "Лимит / Цель", btn_save: "Сохранить" },
            uk: { user_default: "Користувач", sub_active: "Передплата: Активна", main_balance: "Основний баланс", month_income: "Доходи за місяць", month_expense: "Витрати за місяць", btn_expense: "Витрата", btn_income: "Дохід", envelope_title: "Конверти витрат", btn_create: "Створити", banks_title: "Банки та Накопичення", btn_new_bank: "Нова банка", analytics_title: "Аналітика витрат", settings_title: "⚙️ Налаштування", select_language: "Мова інтерфейсу:", select_currency: "Основна валюта:", nav_budget: "Бюджет", nav_banks: "Банки", nav_analytics: "Аналітика", nav_settings: "Налаштування", modal_add_envelope: "Створити конверт", modal_add_bank: "Нова банка", label_name: "Назва", label_target: "Ліміт / Ціль", btn_save: "Зберегти" },
            en: { user_default: "User", sub_active: "Subscription: Active", main_balance: "Main Balance", month_income: "Monthly Income", month_expense: "Monthly Expense", btn_expense: "Expense", btn_income: "Income", envelope_title: "Expense Envelopes", btn_create: "Create", banks_title: "Piggy Banks", btn_new_bank: "New Bank", analytics_title: "Analytics", settings_title: "⚙️ Settings", select_language: "Language:", select_currency: "Currency:", nav_budget: "Budget", nav_banks: "Banks", nav_analytics: "Analytics", nav_settings: "Settings", modal_add_envelope: "Create Envelope", modal_add_bank: "New Bank", label_name: "Name", label_target: "Limit / Target", btn_save: "Save" },
            es: { user_default: "Usuario", sub_active: "Suscripción: Activa", main_balance: "Saldo principal", month_income: "Ingresos", month_expense: "Gastos", btn_expense: "Gasto", btn_income: "Ingreso", envelope_title: "Sobres de gastos", btn_create: "Crear", banks_title: "Huchas", btn_new_bank: "Nueva hucha", analytics_title: "Análisis", settings_title: "⚙️ Ajustes", select_language: "Idioma:", select_currency: "Moneda:", nav_budget: "Presupuesto", nav_banks: "Huchas", nav_analytics: "Análisis", nav_settings: "Ajustes", modal_add_envelope: "Crear sobre", modal_add_bank: "Nueva hucha", label_name: "Nombre", label_target: "Límite / Objetivo", btn_save: "Guardar" },
            de: { user_default: "Benutzer", sub_active: "Abonnement: Aktiv", main_balance: "Hauptguthaben", month_income: "Einnahmen", month_expense: "Ausgaben", btn_expense: "Ausgabe", btn_income: "Einnahme", envelope_title: "Umschläge", btn_create: "Erstellen", banks_title: "Spardosen", btn_new_bank: "Neue Spardose", analytics_title: "Analysen", settings_title: "⚙️ Einstellungen", select_language: "Sprache:", select_currency: "Währung:", nav_budget: "Budget", nav_banks: "Spardosen", nav_analytics: "Analysen", nav_settings: "Einstellungen", modal_add_envelope: "Umschlag erstellen", modal_add_bank: "Neue Spardose", label_name: "Name", label_target: "Ziel", btn_save: "Speichern" },
            fr: { user_default: "Utilisateur", sub_active: "Abonnement: Actif", main_balance: "Solde principal", month_income: "Revenus", month_expense: "Dépenses", btn_expense: "Dépense", btn_income: "Revenu", envelope_title: "Enveloppes", btn_create: "Créer", banks_title: "Tirelires", btn_new_bank: "Nouvelle tirelire", analytics_title: "Analyses", settings_title: "⚙️ Paramètres", select_language: "Langue:", select_currency: "Devise:", nav_budget: "Budget", nav_banks: "Tirelires", nav_analytics: "Analyses", nav_settings: "Paramètres", modal_add_envelope: "Créer une enveloppe", modal_add_bank: "Nouvelle tirelire", label_name: "Nom", label_target: "Limite / Objectif", btn_save: "Enregistrer" },
            pl: { user_default: "Użytkownik", sub_active: "Subskrypcja: Aktywna", main_balance: "Główne saldo", month_income: "Przychody", month_expense: "Wydatki", btn_expense: "Wydatek", btn_income: "Przychód", envelope_title: "Koperty", btn_create: "Utwórz", banks_title: "Skarbonki", btn_new_bank: "Nowa skarbonka", analytics_title: "Analityka", settings_title: "⚙️ Ustawienia", select_language: "Język:", select_currency: "Waluta:", nav_budget: "Budżet", nav_banks: "Skarbonki", nav_analytics: "Analityka", nav_settings: "Ustawienia", modal_add_envelope: "Utwórz kopertę", modal_add_bank: "Nowa skarbonka", label_name: "Nazwa", label_target: "Limit / Cel", btn_save: "Zapisz" }
        };

        let appData = {
            lang: 'ru', currency: 'UAH', balance: 0, monthIncome: 0, monthExpense: 0,
            envelopes: [], banks: []
        };

        let activeTxType = 'expense';

        function loadAppData() {
            const saved = localStorage.getItem("app_budget_v2");
            if (saved) { try { appData = Object.assign(appData, JSON.parse(saved)); } catch(e){} }
            applyLanguage(appData.lang || 'ru');
            renderAll();
        }

        function saveData() { localStorage.setItem("app_budget_v2", JSON.stringify(appData)); }

        function openTransactionModal(type) {
            activeTxType = type;
            const titleElem = document.getElementById('txModalTitle');
            const envGroup = document.getElementById('txEnvelopeGroup');
            
            titleElem.innerText = type === 'expense' ? 'Добавить Расход' : 'Добавить Доход';
            envGroup.style.display = type === 'expense' ? 'block' : 'none';

            const select = document.getElementById('txEnvelopeSelect');
            select.innerHTML = appData.envelopes.map(e => `<option value="${e.id}">${e.name}</option>`).join('');

            openModal('modalTransaction');
        }

        function submitTransaction() {
            const amount = parseFloat(document.getElementById('txAmountInput').value);
            if (!amount || amount <= 0) return;

            if (activeTxType === 'expense') {
                appData.balance -= amount;
                appData.monthExpense += amount;
                const envId = document.getElementById('txEnvelopeSelect').value;
                const env = appData.envelopes.find(e => e.id == envId);
                if (env) env.spent += amount;
            } else {
                appData.balance += amount;
                appData.monthIncome += amount;
            }

            saveData();
            closeModal('modalTransaction');
            document.getElementById('txAmountInput').value = '';
            renderAll();
        }

        function saveEnvelope() {
            const name = document.getElementById('envNameInput').value;
            const target = parseFloat(document.getElementById('envTargetInput').value) || 0;
            if (!name) return;

            appData.envelopes.push({ id: Date.now(), name, target, spent: 0 });
            saveData();
            closeModal('modalAddEnvelope');
            document.getElementById('envNameInput').value = '';
            document.getElementById('envTargetInput').value = '';
            renderAll();
        }

        function saveBank() {
            const name = document.getElementById('bankNameInput').value;
            const target = parseFloat(document.getElementById('bankTargetInput').value) || 0;
            if (!name) return;

            appData.banks.push({ id: Date.now(), name, target, balance: 0 });
            saveData();
            closeModal('modalAddBank');
            document.getElementById('bankNameInput').value = '';
            document.getElementById('bankTargetInput').value = '';
            renderAll();
        }

        function renderAll() {
            document.getElementById("totalBalance").innerText = formatMoney(appData.balance);
            document.getElementById("monthIncome").innerText = `+${formatMoney(appData.monthIncome)}`;
            document.getElementById("monthExpense").innerText = `-${formatMoney(appData.monthExpense)}`;

            const envContainer = document.getElementById('envelopesList');
            envContainer.innerHTML = appData.envelopes.map(e => `
                <div style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-square); padding: 12px; margin-bottom: 8px;">
                    <div style="font-weight: 600;">${e.name}</div>
                    <div style="font-size: 12px; color: var(--text-muted);">${formatMoney(e.spent)} / ${formatMoney(e.target)}</div>
                </div>
            `).join('');

            const bankContainer = document.getElementById('banksList');
            bankContainer.innerHTML = appData.banks.map(b => `
                <div style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-square); padding: 12px; margin-bottom: 8px;">
                    <div style="font-weight: 600;">${b.name}</div>
                    <div style="font-size: 12px; color: var(--text-muted);">${formatMoney(b.balance)} / ${formatMoney(b.target)}</div>
                </div>
            `).join('');
        }

        function applyLanguage(lang) {
            appData.lang = lang;
            saveData();
            const dict = I18N[lang] || I18N.ru;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.getAttribute('data-i18n');
                if (dict[k]) el.innerText = dict[k];
            });
        }

        function changeLanguage(lang) { applyLanguage(lang); }
        function setCurrency(curr) { appData.currency = curr; saveData(); renderAll(); }
        function formatMoney(amount) { return `${Number(amount).toLocaleString()} ${CURRENCY_SYMBOLS[appData.currency] || '₴'}`; }
        function openModal(id) { document.getElementById(id)?.classList.add('active'); }
        function closeModal(id) { document.getElementById(id)?.classList.remove('active'); }
        
        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`tab-${t}`).style.display = 'block';
            document.getElementById(`nav-${t}`)?.classList.add('active');
        }

        window.addEventListener('DOMContentLoaded', loadAppData);
    </script>
</body>
</html>
