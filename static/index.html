<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Семейный Бюджет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --border:#334155;
  --text:#f8fafc; --muted:#94a3b8;
  --accent:#3b82f6; --success:#10b981; --danger:#ef4444; --warning:#f59e0b;
  --radius:14px;
}
[data-theme="light"]{
  --bg:#f5f7fa; --card:#ffffff; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b;
  --accent:#2563eb; --success:#059669; --danger:#dc2626; --warning:#d97706;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);padding-bottom:90px;transition:background .2s,color .2s}
.container{padding:16px;max-width:500px;margin:0 auto}
.muted{color:var(--muted);font-size:12px}
.lbl{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;margin:12px 0 6px;letter-spacing:.5px}
.row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;position:relative}
.card-del{position:absolute;top:8px;right:8px;background:transparent;border:0;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 8px;border-radius:6px}
.card-del:active{color:var(--danger);background:rgba(239,68,68,.1)}

.month-bar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.month-bar button{background:transparent;border:0;color:var(--text);font-size:20px;cursor:pointer;padding:4px 12px;border-radius:8px}
.balance-card{background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:16px}
[data-theme="light"] .balance-card{background:linear-gradient(135deg,#ffffff 0%,#eef2ff 100%)}
.balance-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.balance-val{font-size:32px;font-weight:800;margin:8px 0 16px}
.balance-stats{display:flex;border-top:1px solid var(--border);padding-top:12px}
.stat-item{flex:1;text-align:center}
.stat-item:first-child{border-right:1px solid var(--border)}
.stat-label{font-size:11px;color:var(--muted)}
.stat-amount{font-size:15px;font-weight:700;margin-top:2px}
.stat-amount.inc{color:var(--success)}
.stat-amount.exp{color:var(--danger)}

.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.btn{border:none;padding:12px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#fff;transition:opacity .15s}
.btn:active{opacity:.85}
.btn-accent{background:var(--accent)}
.btn-success{background:var(--success)}
.btn-danger{background:var(--danger)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:6px 12px;font-size:12px}

.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px;max-height:240px;overflow-y:auto;padding-right:2px}
.icon-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.icon-item .emoji{font-size:20px;line-height:1}
.icon-item .name{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.icon-item.active{border-color:var(--accent);background:rgba(59,130,246,.15)}
.icon-item.active .name{color:var(--accent)}

.custom-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-size:14px;margin-bottom:12px;outline:none}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.history-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.history-icon{font-size:20px;background:rgba(255,255,255,.05);padding:8px;border-radius:10px}
.history-title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-sub{font-size:11px;color:var(--muted);margin-top:2px}
.history-amount{font-weight:700;font-size:15px}
.history-tools{display:flex;gap:4px}
.history-tools button{background:transparent;border:1px solid var(--border);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}

.nav-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:11px;cursor:pointer;gap:4px;width:20%}
.nav-item.active{color:var(--accent)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;z-index:1000}
.modal.active{display:flex}
.modal-content{background:var(--card);border-radius:20px 20px 0 0;width:100%;padding:20px;max-height:88vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-close{font-size:24px;color:var(--muted);cursor:pointer}

.seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:4px;gap:4px;margin-bottom:12px}
.seg-btn{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
.seg-btn.active{background:var(--accent);color:#fff}
</style>
</head>
<body>

<div class="container">
  <div id="tab-budget" class="tab-content">
    <div class="month-bar">
      <button onclick="shiftMonth(-1)">‹</button>
      <div><span id="monthLabel">—</span> <span id="yearLabel">—</span></div>
      <button onclick="shiftMonth(1)">›</button>
    </div>
    <div class="balance-card">
      <div class="balance-title">Текущий баланс</div>
      <div class="balance-val" id="totalBalance">0 ₴</div>
      <div class="balance-stats">
        <div class="stat-item"><div class="stat-label">Доходы</div><div class="stat-amount inc" id="monthIncome">+0 ₴</div></div>
        <div class="stat-item"><div class="stat-label">Расходы</div><div class="stat-amount exp" id="monthExpense">-0 ₴</div></div>
      </div>
    </div>
    <div class="actions-grid">
      <button class="btn btn-success" onclick="openTransactionModal('income')"><i class="fa-solid fa-plus"></i> Доход</button>
      <button class="btn btn-danger" onclick="openTransactionModal('expense')"><i class="fa-solid fa-minus"></i> Расход</button>
    </div>
    
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <button class="seg-btn active" onclick="setHistFilter('all')">Все</button>
      <button class="seg-btn" onclick="setHistFilter('income')">Доходы</button>
      <button class="seg-btn" onclick="setHistFilter('expense')">Расходы</button>
    </div>
    <div id="historyContainer" class="history-list"></div>
  </div>

  <div id="tab-envelopes" class="tab-content" style="display:none">
    <div class="row-between"><h4>Конверты</h4><button class="btn btn-accent" onclick="openModal('modalAddEnvelope')">+ Создать</button></div>
    <div id="envelopesList"></div>
  </div>

  <div id="tab-banks" class="tab-content" style="display:none">
    <div class="row-between"><h4>Банки</h4><button class="btn btn-accent" onclick="openModal('modalAddBank')">+ Создать</button></div>
    <div id="banksList"></div>
  </div>

  <div id="tab-settings" class="tab-content" style="display:none">
    <div class="card">
      <h5>Настройки</h5>
      <button class="btn btn-outline" style="width:100%;margin-top:10px" onclick="exportCSV()">Скачать CSV</button>
    </div>
  </div>
</div>

<div class="nav-bar">
  <div class="nav-item active" id="nav-budget" onclick="switchTab('budget')"><i class="fa-solid fa-wallet"></i><span>Главная</span></div>
  <div class="nav-item" id="nav-envelopes" onclick="switchTab('envelopes')"><i class="fa-solid fa-envelope"></i><span>Конверты</span></div>
  <div class="nav-item" id="nav-banks" onclick="switchTab('banks')"><i class="fa-solid fa-vault"></i><span>Банки</span></div>
  <div class="nav-item" id="nav-settings" onclick="switchTab('settings')"><i class="fa-solid fa-sliders"></i><span>Настройки</span></div>
</div>

<div class="modal" id="modalTransaction">
  <div class="modal-content">
    <div class="modal-header"><h3 id="txModalTitle">Добавить</h3><span class="modal-close" onclick="closeModal('modalTransaction')">×</span></div>
    <div id="categoryGrid" class="icon-grid"></div>
    <input type="number" id="txAmountInput" class="custom-input" placeholder="Сумма">
    <input type="text" id="txCommentInput" class="custom-input" placeholder="Комментарий">
    <button class="btn btn-accent" style="width:100%" onclick="submitTransaction()">Сохранить</button>
  </div>
</div>

<div class="modal" id="modalAddEnvelope">
  <div class="modal-content">
    <div class="modal-header"><h3>Новый конверт</h3><span class="modal-close" onclick="closeModal('modalAddEnvelope')">×</span></div>
    <input type="text" id="envNameInput" class="custom-input" placeholder="Название">
    <input type="number" id="envTargetInput" class="custom-input" placeholder="Лимит">
    <button class="btn btn-accent" style="width:100%" onclick="saveEnvelope()">Создать</button>
  </div>
</div>

<div class="modal" id="modalAddBank">
  <div class="modal-content">
    <div class="modal-header"><h3>Новая банка</h3><span class="modal-close" onclick="closeModal('modalAddBank')">×</span></div>
    <input type="text" id="bankNameInput" class="custom-input" placeholder="Название">
    <input type="number" id="bankTargetInput" class="custom-input" placeholder="Цель">
    <button class="btn btn-accent" style="width:100%" onclick="saveBank()">Создать</button>
  </div>
</div>

<script>
let appData = JSON.parse(localStorage.getItem('budgetApp_final')) || {
  balance: 0, monthIncome: 0, monthExpense: 0, history: [], envelopes: [], banks: [],
  selectedCategory: 'Еда', currentIcon: '🍔', histFilter: 'all',
  currentMonth: new Date().getFullYear() + '-' + String(new Date().getMonth()+1).padStart(2,'0')
};

function saveData(){ localStorage.setItem('budgetApp_final', JSON.stringify(appData)); }
function fmtMoney(v){ return Number(v||0).toLocaleString('ru-RU') + ' ₴'; }

function switchTab(name){
  document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.getElementById('tab-' + name).style.display = 'block';
  document.getElementById('nav-' + name).classList.add('active');
  renderAll();
}

function openModal(id){ document.getElementById(id).classList.add('active'); }
function closeModal(id){ document.getElementById(id).classList.remove('active'); }

const EXPENSE = [{icon:'🍔',name:'Еда'},{icon:'☕',name:'Кафе'},{icon:'🚗',name:'Транспорт'},{icon:'🏠',name:'Дом'},{icon:'📦',name:'Разное'}];
const INCOME = [{icon:'💰',name:'Зарплата'},{icon:'💸',name:'Кэшбэк'},{icon:'🎁',name:'Подарок'}];

function openTransactionModal(type){
  appData.activeTxType = type;
  document.getElementById('txModalTitle').innerText = type === 'expense' ? 'Добавить расход' : 'Добавить доход';
  const cats = type === 'expense' ? EXPENSE : INCOME;
  const grid = document.getElementById('categoryGrid');
  grid.innerHTML = cats.map((c,i) => `<div class="icon-item ${i===0?'active':''}" data-name="${c.name}" data-icon="${c.icon}"><span class="emoji">${c.icon}</span><span class="name">${c.name}</span></div>`).join('');
  grid.querySelectorAll('.icon-item').forEach(el => {
    el.onclick = () => {
      grid.querySelectorAll('.icon-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      appData.selectedCategory = el.dataset.name;
      appData.currentIcon = el.dataset.icon;
    };
  });
  appData.selectedCategory = cats[0].name;
  appData.currentIcon = cats[0].icon;
  openModal('modalTransaction');
}

function submitTransaction(){
  const amount = parseFloat(document.getElementById('txAmountInput').value);
  if(!amount || amount <= 0) return;
  const tx = {
    id: Date.now(), type: appData.activeTxType, 
    title: document.getElementById('txCommentInput').value || appData.selectedCategory,
    category: appData.selectedCategory, icon: appData.currentIcon, amount, date: new Date().toLocaleDateString('ru-RU')
  };
  appData.history.unshift(tx);
  if(tx.type === 'expense'){ appData.balance -= amount; appData.monthExpense += amount; }
  else { appData.balance += amount; appData.monthIncome += amount; }
  saveData(); closeModal('modalTransaction'); renderAll();
}

function deleteTx(id){
  const tx = appData.history.find(x => x.id === id);
  if(!tx) return;
  if(tx.type === 'expense'){ appData.balance += tx.amount; appData.monthExpense -= tx.amount; }
  else { appData.balance -= tx.amount; appData.monthIncome -= tx.amount; }
  appData.history = appData.history.filter(x => x.id !== id);
  saveData(); renderAll();
}

function saveEnvelope(){
  const name = document.getElementById('envNameInput').value;
  const target = parseFloat(document.getElementById('envTargetInput').value);
  if(!name) return;
  appData.envelopes.push({ id: Date.now(), name, target });
  saveData(); closeModal('modalAddEnvelope'); renderAll();
}

function saveBank(){
  const name = document.getElementById('bankNameInput').value;
  const target = parseFloat(document.getElementById('bankTargetInput').value);
  if(!name) return;
  appData.banks.push({ id: Date.now(), name, target, balance: 0 });
  saveData(); closeModal('modalAddBank'); renderAll();
}

function setHistFilter(f){
  appData.histFilter = f;
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderAll();
}

function exportCSV(){
  const csv = "Дата,Тип,Сумма,Категория\n" + appData.history.map(t => `${t.date},${t.type},${t.amount},${t.category}`).join("\n");
  const blob = new Blob(["\uFEFF"+csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  if(window.Telegram?.WebApp?.openLink) Telegram.WebApp.openLink(url);
  else window.open(url, '_blank');
}

function renderAll(){
  document.getElementById('totalBalance').innerText = fmtMoney(appData.balance);
  document.getElementById('monthIncome').innerText = '+' + fmtMoney(appData.monthIncome);
  document.getElementById('monthExpense').innerText = '-' + fmtMoney(appData.monthExpense);
  
  const hist = document.getElementById('historyContainer');
  const filtered = appData.history.filter(t => appData.histFilter === 'all' || t.type === appData.histFilter);
  
  hist.innerHTML = filtered.length ? filtered.map(tx => `
    <div class="history-item">
      <div class="history-left">
        <div class="history-icon">${tx.icon}</div>
        <div><div class="history-title">${tx.title}</div><div class="history-sub">${tx.date}</div></div>
      </div>
      <div class="history-amount">${tx.type==='expense'?'-':'+'}${fmtMoney(tx.amount)}</div>
      <div class="history-tools"><button onclick="deleteTx(${tx.id})">✕</button></div>
    </div>`).join('') : `<div class="muted" style="text-align:center">Пусто</div>`;

  document.getElementById('envelopesList').innerHTML = appData.envelopes.map(e => `<div class="card"><b>📩 ${e.name}</b><br>Лимит: ${fmtMoney(e.target)}</div>`).join('');
  document.getElementById('banksList').innerHTML = appData.banks.map(b => `<div class="card"><b>🏦 ${b.name}</b><br>Цель: ${fmtMoney(b.target)}</div>`).join('');
}

renderAll();
</script>
</body>
</html>
