<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1116">
<title>Family Budget</title>
<link rel="stylesheet" href="./style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="auth-screen hidden" id="auth-screen" style="display:none">
  <div class="auth-box">
    <h1>Семья</h1>
    <p class="sub">Один код — все видят одни траты</p>
    <div class="field"><label>Ваше имя</label>
      <input type="text" id="auth-fname" placeholder="Иван" maxlength="20"></div>
    <button class="btn-primary" id="btn-create" style="width:100%">Создать семью</button>
    <div style="text-align:center;color:var(--muted);font-size:12px;margin:16px 0">или войти по коду</div>
    <div class="field"><label>Код семьи</label>
      <input type="text" id="auth-code" class="code-input" placeholder="XXXXXX" maxlength="6" autocomplete="off"></div>
    <button class="btn-cancel" id="btn-join" style="width:100%">Войти</button>
    <button class="btn-cancel" id="btn-auth-cancel" style="width:100%;margin-top:10px">Отмена</button>
  </div>
</div>

<div id="main-app" style="display:block">
  <div class="topbar">
    <div class="month-nav">
      <button id="prev">‹</button>
      <div class="label" id="mlabel">—</div>
      <button id="next">›</button>
      <div class="lang-switch">
        <button class="lang-btn on" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
    <div class="family-badge" id="family-badge" style="display:none">
      <span>👨‍👩‍👧</span><b id="family-name">Семья</b>
      <span>·</span><span id="family-count">1</span>
      <span>· код: <b id="family-code">···</b></span>
    </div>
    <div class="balance-label">Баланс месяца</div>
    <div class="balance" id="bal">0</div>
    <div class="summary">
      <div class="summary-box income"><div class="lbl">Доходы</div><div class="val" id="sum-in">0</div></div>
      <div class="summary-box expense"><div class="lbl">Расходы</div><div class="val" id="sum-ex">0</div></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab on" data-v="list">📋 Записи</div>
    <div class="tab" data-v="env">💰 Конверты</div>
    <div class="tab" data-v="stats">📊 Стата</div>
    <div class="tab" data-v="settings">⚙️</div>
  </div>

  <div class="view on" id="v-list"><div class="list" id="list"></div></div>
  <div class="view" id="v-env"><div class="env-list" id="env-list"></div></div>
  <div class="view" id="v-stats">
    <div class="stat-block"><h3>Топ категорий за месяц</h3><div id="stats-cats"></div></div>
  </div>
  <div class="view" id="v-settings">
    <div class="stat-block" id="family-block">
      <h3 style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">Семья</h3>
      <div id="family-personal">
        <p style="color:var(--muted);font-size:13px;margin-bottom:12px">Сейчас личный режим</p>
        <button class="btn-primary" id="btn-open-family" style="width:100%">Подключить семью</button>
      </div>
      <div id="family-active" style="display:none">
        <div style="font-size:14px;margin-bottom:10px">Код: <b id="family-code-display" style="color:var(--blue);letter-spacing:4px">—</b></div>
        <div class="members-list" id="members-list" style="margin-bottom:12px"></div>
        <button class="btn-cancel" id="btn-copy-code" style="width:100%;margin-bottom:8px">Скопировать код</button>
        <button class="btn-delete" id="btn-leave-family" style="width:100%">Выйти из семьи</button>
      </div>
    </div>
    <div class="stat-block">
      <div class="set-row"><div><div class="lbl">Всего записей</div><div class="sub" id="total-count">0</div></div></div>
      <div class="set-row">
        <div><div class="lbl">Экспорт CSV</div><div class="sub">все записи</div></div>
        <button class="btn-cancel" id="export-btn">Скачать</button>
      </div>
    </div>
  </div>

  <button class="fab" id="fab">+</button>
</div>

<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.from(document.querySelectorAll(s))};

var state={mode:"local",userName:"",familyCode:null,familyName:"",records:[],envelopes:{},members:{},viewMonth:null,uid:null,lang:"ru"};
var KEY="fb_data_v3";
var UID_KEY="budget_uid";
var LANG_KEY="budget_lang";
var MONTHS=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];

var INCOME=[
  {id:"salary",name:"Зарплата",e:"💼"},
  {id:"freel",name:"Фриланс",e:"💻"},
  {id:"gift_in",name:"Подарок",e:"🎁"},
  {id:"invest",name:"Инвестиции",e:"📈"},
  {id:"cashback",name:"Кэшбэк",e:"💵"},
  {id:"other_in",name:"Другое",e:"💰"}
];

var EXPENSE=[
  {id:"food",name:"Продукты",e:"🍔"},
  {id:"delivery",name:"Доставка",e:"🛵"},
  {id:"coffee",name:"Кофе/снеки",e:"☕"},
  {id:"rent",name:"Аренда",e:"🏠"},
  {id:"util",name:"Коммуналка",e:"💡"},
  {id:"transp",name:"Транспорт",e:"🚌"},
  {id:"taxi",name:"Такси",e:"🚕"},
  {id:"fuel",name:"Бензин",e:"⛽"},
  {id:"health",name:"Здоровье",e:"💊"},
  {id:"doctor",name:"Врачи",e:"🏥"},
  {id:"fun",name:"Развлечения",e:"🎮"},
  {id:"clothes",name:"Одежда",e:"👕"},
  {id:"kids",name:"Дети",e:"🧒"},
  {id:"pets",name:"Животные",e:"🐕"},
  {id:"online",name:"Онлайн-покупки",e:"🛒"},
  {id:"subs",name:"Подписки",e:"📺"},
  {id:"credit",name:"Кредиты",e:"💳"},
  {id:"repair",name:"Ремонт/дом",e:"🔧"},
  {id:"travel",name:"Путешествия",e:"✈️"},
  {id:"edu",name:"Образование",e:"📚"},
  {id:"beauty",name:"Красота",e:"💅"},
  {id:"sport",name:"Спорт",e:"🏋️"},
  {id:"gift",name:"Подарки",e:"🎀"},
  {id:"tech",name:"Техника",e:"📱"},
  {id:"vape",name:"Вейп/сигареты",e:"💨"},
  {id:"party",name:"Праздники",e:"🎉"},
  {id:"tax",name:"Налоги",e:"📋"},
  {id:"bank",name:"Банк/комиссии",e:"🏦"},
  {id:"other_ex",name:"Другое",e:"📦"}
];

var ALL=INCOME.concat(EXPENSE);
function findCat(id){return ALL.find(function(c){return c.id===id})||{id:id,name:"?",e:"❓"}}
function fmt(n){var a=Math.abs(n);var s=a.toFixed(2).replace(/\.00$/,"");return (n<0?"-":"")+s}

function toast(msg,cls){
  var el=$("#toast");
  el.textContent=msg;
  el.className="toast show "+(cls||"");
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){el.className="toast "+(cls||"")},1800);
}

function monthLabel(ym){return MONTHS[parseInt(ym.split("-")[1])-1]+" "+ym.split("-")[0]}
function shiftMonth(ym,d){
  var p=ym.split("-"),y=parseInt(p[0]),m=parseInt(p[1])-1+d;
  while(m<0){m+=12;y--}
  while(m>11){m-=12;y++}
  return y+"-"+String(m+1).padStart(2,"0");
}
function genCode(){
  var s="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",c="";
  for(var i=0;i<6;i++)c+=s[Math.floor(Math.random()*s.length)];
  return c;
}
function saveLocal(){
  localStorage.setItem(USER_KEY,JSON.stringify({
    mode:state.mode,records:state.records,envelopes:state.envelopes
  }));
  if(state.familyCode){
    localStorage.setItem(FAMILY_KEY,state.familyCode);
    localStorage.setItem(FAMILY_KEY+"_name",state.familyName||"");
  }else{
    localStorage.removeItem(FAMILY_KEY);
    localStorage.removeItem(FAMILY_KEY+"_name");
  }
}
function recordsOfMonth(ym){return state.records.filter(function(r){return r.date&&r.date.startsWith(ym)})}
function today(){return new Date().toISOString().slice(0,10)}

function closeAuth(){$("#auth-screen").style.display="none"}
function openAuth(){$("#auth-screen").style.display="flex"}

var familySub=null;
function subscribeFamily(){
  if(familySub){familySub.off();familySub=null}
  if(!state.familyCode)return;
  familySub=db.ref("families/"+state.familyCode);
  familySub.on("value",function(snap){
    if(!snap.exists())return;
    var v=snap.val();
    state.familyName=v.name||"Семья";
    state.members=v.members||{};
    state.envelopes=v.envelopes||{};
    var recs=v.records||{};
    state.records=Object.keys(recs).map(function(k){var r=recs[k];r.id=k;return r});
    render();
  });
}
  
function render(){
  var ym=state.viewMonth;
  var recs=recordsOfMonth(ym);
  var inc=0,ex=0;
  recs.forEach(function(r){if(r.type==="income")inc+=r.amount;else ex+=r.amount});
  var bal=inc-ex;

  $("#mlabel").textContent=monthLabel(ym);
  $("#bal").textContent=fmt(bal);
  $("#bal").className="balance "+(bal>0?"pos":bal<0?"neg":"");
  $("#sum-in").textContent=fmt(inc);
  $("#sum-ex").textContent=fmt(ex);

  if(state.mode==="family"&&state.familyCode){
    $("#family-badge").style.display="inline-flex";
    $("#family-name").textContent=state.familyName||"Семья";
    $("#family-count").textContent=Object.keys(state.members).length;
    $("#family-code").textContent=state.familyCode;
    $("#family-personal").style.display="none";
    $("#family-active").style.display="block";
    $("#family-code-display").textContent=state.familyCode;
    var ml=$("#members-list");
    var mem=Object.values(state.members||{});
    ml.innerHTML=mem.length?mem.map(function(m){return '<span class="member-chip">'+m.name+'</span>'}).join(""):'';
  }else{
    $("#family-badge").style.display="none";
    $("#family-personal").style.display="block";
    $("#family-active").style.display="none";
  }

  var sorted=recs.slice().sort(function(a,b){return (b.ts||0)-(a.ts||0)});
  var list=$("#list");
  if(!sorted.length){
    list.innerHTML='<div class="empty">Записей нет<br><br>Нажми <b>+</b> чтобы добавить</div>';
  }else{
    list.innerHTML=sorted.map(function(r){
      var c=findCat(r.cat);
      var sign=r.type==="income"?"+":"−";
      var by=(state.mode==="family"&&r.byName)?'<div style="font-size:10px;color:var(--muted);margin-top:2px">'+r.byName+'</div>':'';
      return '<div class="rec" data-id="'+r.id+'">'
        +'<div class="ico">'+c.e+'</div>'
        +'<div class="info"><div class="name">'+(r.note||c.name)+'</div>'
        +'<div class="date">'+c.name+' · '+r.date.split("-").reverse().join(".")+'</div></div>'
        +'<div style="text-align:right"><div class="amt '+r.type+'">'+sign+fmt(r.amount)+'</div>'+by+'</div>'
        +'</div>';
    }).join("");
  }
  renderEnvelopes(recs);
  renderStats(recs);
  $("#total-count").textContent=state.records.length;
}

function renderEnvelopes(recs){
  var el=$("#env-list");
  var keys=Object.keys(state.envelopes);
  if(!keys.length){
    el.innerHTML='<div class="empty">Нет конвертов<br><br>Нажми <b>+</b> чтобы добавить бюджет по теме</div>';
    return;
  }
  var byCat={};
  recs.filter(function(r){return r.type==="expense"}).forEach(function(r){
    byCat[r.cat]=(byCat[r.cat]||0)+r.amount;
  });
  el.innerHTML=keys.map(function(catId){
    var lim=state.envelopes[catId];
    var spent=byCat[catId]||0;
    var left=lim-spent;
    var pct=lim>0?Math.min(100,spent/lim*100):0;
    var cls=spent>lim?"over":(pct>=80?"warn":"");
    var c=findCat(catId);
    return '<div class="env '+cls+'">'
      +'<div class="env-head">'
      +'<div class="env-name"><span class="e">'+c.e+'</span>'+c.name+'</div>'
      +'<button class="env-edit" data-cat="'+catId+'">✏️</button>'
      +'</div>'
      +'<div class="env-nums">израсходовано <b>'+fmt(spent)+'</b> из '+fmt(lim)+' · осталось <b>'+fmt(left)+'</b></div>'
      +'<div class="env-bar"><i style="width:'+pct+'%"></i></div>'
      +'</div>';
  }).join("");
  el.querySelectorAll(".env-edit").forEach(function(b){
    b.onclick=function(){editEnvelope(b.dataset.cat)};
  });
}

function renderStats(recs){
  var ex=recs.filter(function(r){return r.type==="expense"});
  var total=ex.reduce(function(s,r){return s+r.amount},0);
  var byCat={};
  ex.forEach(function(r){byCat[r.cat]=(byCat[r.cat]||0)+r.amount});
  var cats=Object.entries(byCat).sort(function(a,b){return b[1]-a[1]}).slice(0,10);
  var el=$("#stats-cats");
  if(!cats.length){
    el.innerHTML='<div style="color:var(--muted);font-size:13px">нет расходов</div>';
  }else{
    el.innerHTML=cats.map(function(kv){
      var c=findCat(kv[0]);
      var pct=total>0?(kv[1]/total*100):0;
      return '<div class="cat-row"><div class="ico">'+c.e+'</div>'
        +'<div class="name">'+c.name+' <span style="color:var(--muted);font-size:11px">'+pct.toFixed(0)+'%</span></div>'
        +'<div class="val">'+fmt(kv[1])+'</div></div>';
    }).join("");
  }
}

var modal=null;
var edit={type:"expense",cat:"food",amount:"",note:"",date:"",id:null};

function openRecord(existing){
  if(existing){
    edit={type:existing.type,cat:existing.cat,amount:String(existing.amount),
          note:existing.note||"",shop:existing.shop||"",date:existing.date,id:existing.id};
  }else{
    edit={type:"expense",cat:"food",amount:"",note:"",shop:"",date:today(),id:null};
  }
  renderRecordModal();
}

function renderRecordModal(){
  if(modal)modal.remove();
  modal=document.createElement("div");
  modal.className="modal";
  var cats=edit.type==="income"?INCOME:EXPENSE;
  modal.innerHTML='<div class="sheet">'
    +'<h2>'+(edit.id?"Изменить":"Новая запись")+'</h2>'
    +'<div class="type-switch">'
    +'<button class="'+(edit.type==="expense"?"on expense":"")+'" data-t="expense">− Расход</button>'
    +'<button class="'+(edit.type==="income"?"on income":"")+'" data-t="income">+ Доход</button>'
    +'</div>'
    +'<div class="field"><label>Сумма</label>'
    +'<input type="number" inputmode="decimal" step="0.01" id="m-am" class="amount-input" placeholder="0" value="'+edit.amount+'"></div>'
    +'<div class="field"><label>Категория</label><div class="cat-grid">'
    +cats.map(function(c){
      return '<div class="cat '+(edit.cat===c.id?"on":"")+'" data-cat="'+c.id+'">'
        +'<span class="e">'+c.e+'</span>'+c.name+'</div>';
    }).join("")
    +'</div></div>'
    +'<div class="field"><label>Магазин / место</label>'
+'<input type="text" id="m-shop" placeholder="Сильпо, ATB, Rozetka..." value="'+(edit.shop||"").replace(/"/g,"&quot;")+'"></div>'
+'<div class="field"><label>Комментарий</label>'
+'<input type="text" id="m-note" placeholder="необязательно" value="'+(edit.note||"").replace(/"/g,"&quot;")+'"></div>'
    +'<div class="field"><label>Дата</label>'
    +'<input type="date" id="m-date" value="'+edit.date+'"></div>'
    +'<div class="row-btns">'
    +(edit.id?'<button class="btn-delete" data-act="del">Удалить</button>':'')
    +'<button class="btn-cancel" data-act="cancel">Отмена</button>'
    +'<button class="btn-primary" data-act="save">Сохранить</button>'
    +'</div></div>';
  document.body.appendChild(modal);
  attachRecordEvents();
}

function attachRecordEvents(){
  modal.querySelectorAll(".type-switch button").forEach(function(b){
    b.onclick=function(){
      edit.type=b.dataset.t;
      edit.cat=(edit.type==="income"?INCOME[0].id:EXPENSE[0].id);
      edit.amount=modal.querySelector("#m-am").value;
      edit.note=modal.querySelector("#m-note").value;
      renderRecordModal();
    };
  });
  modal.querySelectorAll(".cat").forEach(function(c){
    c.onclick=function(){
      edit.cat=c.dataset.cat;
      modal.querySelectorAll(".cat").forEach(function(x){x.classList.remove("on")});
      c.classList.add("on");
    };
  });
  modal.querySelectorAll("[data-act]").forEach(function(b){
    b.onclick=function(){
      var act=b.dataset.act;
      if(act==="cancel"){modal.remove();modal=null;return}
      if(act==="del"){
        if(state.mode==="family"){
          db.ref("families/"+state.familyCode+"/records/"+edit.id).remove();
        }else{
          state.records=state.records.filter(function(r){return r.id!==edit.id});
          saveLocal();render();
        }
        modal.remove();modal=null;toast("Удалено");return;
      }
      if(act==="save"){
        var amt=parseFloat(modal.querySelector("#m-am").value);
        if(!amt||amt<=0){toast("Введи сумму","err");return}
        var note=modal.querySelector("#m-note").value.trim();
var shop=modal.querySelector("#m-shop").value.trim();
var date=modal.querySelector("#m-date").value||today();
var rec={type:edit.type,cat:edit.cat,amount:amt,note:note,shop:shop,date:date,
         ts:Date.now(),byName:state.userName||"",byUid:state.uid||""};
        if(state.mode==="family"){
          var id=edit.id||(Date.now()+"-"+Math.random().toString(36).slice(2,8));
          db.ref("families/"+state.familyCode+"/records/"+id).set(rec);
        }else{
          if(edit.id){
            var r=state.records.find(function(x){return x.id===edit.id});
            if(r)Object.assign(r,rec);
          }else{
            rec.id=Date.now()+"-"+Math.random().toString(36).slice(2,8);
            state.records.push(rec);
          }
          saveLocal();render();
        }
        var ym=date.slice(0,7);
        if(ym!==state.viewMonth)state.viewMonth=ym;
        render();modal.remove();modal=null;toast("Сохранено","ok");
      }
    };
  });
  modal.onclick=function(e){if(e.target===modal){modal.remove();modal=null}};
}

function editEnvelope(catId){
  if(modal)modal.remove();
  modal=document.createElement("div");
  modal.className="modal";
  var isNew=!catId;
  var current=catId?state.envelopes[catId]:"";
  modal.innerHTML='<div class="sheet">'
    +'<h2>'+(isNew?"Новый конверт":"Изменить конверт")+'</h2>'
    +(isNew?('<div class="field"><label>Категория</label><div class="cat-grid">'
      +EXPENSE.map(function(c){
        return '<div class="cat" data-cat="'+c.id+'"><span class="e">'+c.e+'</span>'+c.name+'</div>';
      }).join("")+'</div></div>'):'')
    +'<div class="field"><label>Лимит на месяц</label>'
    +'<input type="number" inputmode="decimal" step="1" id="m-lim" class="amount-input" placeholder="0" value="'+current+'"></div>'
    +'<div class="row-btns">'
    +(isNew?'':'<button class="btn-delete" data-act="del">Удалить</button>')
    +'<button class="btn-cancel" data-act="cancel">Отмена</button>'
    +'<button class="btn-primary" data-act="save">Сохранить</button>'
    +'</div></div>';
  document.body.appendChild(modal);
  var chosenCat=catId||null;
  modal.querySelectorAll(".cat").forEach(function(c){
    c.onclick=function(){
      chosenCat=c.dataset.cat;
      modal.querySelectorAll(".cat").forEach(function(x){x.classList.remove("on")});
      c.classList.add("on");
    };
  });
  modal.querySelectorAll("[data-act]").forEach(function(b){
    b.onclick=function(){
      var act=b.dataset.act;
      if(act==="cancel"){modal.remove();modal=null;return}
      if(act==="del"){
        if(state.mode==="family"){
          db.ref("families/"+state.familyCode+"/envelopes/"+catId).remove();
        }else{
          delete state.envelopes[catId];saveLocal();render();
        }
        modal.remove();modal=null;toast("Удалено");return;
      }
      if(act==="save"){
        var lim=parseFloat(modal.querySelector("#m-lim").value);
        if(!lim||lim<=0){toast("Введи лимит","err");return}
        if(!chosenCat){toast("Выбери категорию","err");return}
        if(state.mode==="family"){
          db.ref("families/"+state.familyCode+"/envelopes/"+chosenCat).set(lim);
        }else{
          state.envelopes[chosenCat]=lim;saveLocal();render();
        }
        modal.remove();modal=null;toast("Сохранено","ok");
      }
    };
  });
  modal.onclick=function(e){if(e.target===modal){modal.remove();modal=null}};
        }
  
$$(".tab").forEach(function(t){
  t.onclick=function(){
    $$(".tab").forEach(function(x){x.classList.remove("on")});
    $$(".view").forEach(function(x){x.classList.remove("on")});
    t.classList.add("on");
    document.getElementById("v-"+t.dataset.v).classList.add("on");
  };
});

$("#prev").onclick=function(){state.viewMonth=shiftMonth(state.viewMonth,-1);render()};
$("#next").onclick=function(){state.viewMonth=shiftMonth(state.viewMonth,+1);render()};

$("#fab").onclick=function(){
  if($("#v-env").classList.contains("on"))editEnvelope(null);
  else openRecord();
};

$("#list").addEventListener("click",function(e){
  var rec=e.target.closest(".rec");
  if(!rec)return;
  var existing=state.records.find(function(r){return r.id===rec.dataset.id});
  if(existing)openRecord(existing);
});

$$(".lang-btn").forEach(function(b){
  b.onclick=function(){
    state.lang=b.dataset.lang;
    localStorage.setItem(LANG_KEY,state.lang);
    $$(".lang-btn").forEach(function(x){x.classList.toggle("on",x.dataset.lang===state.lang)});
    toast(state.lang==="en"?"Language: English":"Язык: русский","ok");
  };
});

$("#btn-open-family").onclick=function(){
  $("#auth-fname").value=state.userName||"";
  openAuth();
};
$("#btn-auth-cancel").onclick=closeAuth;

$("#btn-create").onclick=function(){
  var n=$("#auth-fname").value.trim();
  if(!n){toast("Введи имя","err");return}
  if(!state.uid){toast("Подключение к Firebase... жди 3 сек","err");setTimeout(function(){$("#btn-create").click()},3000);return}
  state.userName=n;state.mode="family";state.familyCode=genCode();
  var ref=db.ref("families/"+state.familyCode);
  ref.set({name:"Семья "+n,createdAt:Date.now()}).then(function(){
    return ref.child("members").child(state.uid).set({name:n,joined:Date.now()});
  }).then(function(){
    toast("Семья создана: "+state.familyCode,"ok");
    saveLocal();closeAuth();subscribeFamily();
  }).catch(function(e){toast("Ошибка: "+e.message,"err")});
};

$("#btn-join").onclick=function(){
  var n=$("#auth-fname").value.trim();
  var c=$("#auth-code").value.trim().toUpperCase();
  if(!n){toast("Введи имя","err");return}
  if(c.length!==6){toast("Код из 6 знаков","err");return}
  if(!state.uid){toast("Подключение к Firebase... жди 3 сек","err");setTimeout(function(){$("#btn-join").click()},3000);return}
  var ref=db.ref("families/"+c);
  ref.once("value").then(function(snap){
    if(!snap.exists()){toast("Семья не найдена","err");return}
    state.userName=n;state.mode="family";state.familyCode=c;
    state.familyName=snap.val().name||"Семья";
    return ref.child("members").child(state.uid).set({name:n,joined:Date.now()}).then(function(){
      toast("Присоединился","ok");saveLocal();closeAuth();subscribeFamily();
    });
  }).catch(function(e){toast("Ошибка: "+e.message,"err")});
};

$("#btn-copy-code").onclick=function(){
  if(!state.familyCode)return;
  navigator.clipboard.writeText(state.familyCode);
  toast("Код: "+state.familyCode,"ok");
};

$("#btn-leave-family").onclick=function(){
  if(!confirm("Выйти из семьи?"))return;
  if(familySub){familySub.off();familySub=null}
  state.mode="local";state.familyCode=null;state.familyName="";
  state.records=[];state.members={};state.envelopes={};
  saveLocal();render();toast("Вышел из семьи");
};

$("#export-btn").onclick=function(){
  if(!state.records.length){toast("Нет записей","err");return}
  var rows=[["дата","тип","категория","сумма","комментарий","кто"]];
  state.records.slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"")}).forEach(function(r){
    var c=findCat(r.cat);
    rows.push([r.date,r.type==="income"?"доход":"расход",c.name,r.amount,r.note||"",r.byName||""]);
  });
  var csv=rows.map(function(row){
    return row.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(",");
  }).join("\n");
  var blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="budget-"+today()+".csv";
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
  toast("Скачано","ok");
};

var storedLang=localStorage.getItem(LANG_KEY);
if(storedLang)state.lang=storedLang;
$$(".lang-btn").forEach(function(x){x.classList.toggle("on",x.dataset.lang===state.lang)});

var tgUser = window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initDataUnsafe
  ?window.Telegram.WebApp.initDataUnsafe.user:null;
var tgId = tgUser&&tgUser.id ? String(tgUser.id) : "anon";

if(tgUser&&tgUser.first_name)state.userName=tgUser.first_name;
if(!state.userName)state.userName="Гость";

var USER_KEY = "budget_data_" + tgId;
var FAMILY_KEY = "budget_family_" + tgId;

function bootApp(){
  auth.signInAnonymously().then(function(cred){
    state.uid = tgId;

    try{
      var saved=JSON.parse(localStorage.getItem(USER_KEY)||"{}");
      if(saved.mode)state.mode=saved.mode;
      if(saved.records)state.records=saved.records;
      if(saved.envelopes)state.envelopes=saved.envelopes;
    }catch(e){}

    var famCode = localStorage.getItem(FAMILY_KEY);
    var famName = localStorage.getItem(FAMILY_KEY + "_name");
    if(famCode && state.mode==="family"){
      state.familyCode = famCode;
      state.familyName = famName || "Семья";
    }

    var n=new Date();
    state.viewMonth=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");

    if(state.mode==="family"&&state.familyCode){subscribeFamily()}
    render();
  }).catch(function(e){
    state.uid = tgId;
    try{
      var saved=JSON.parse(localStorage.getItem(USER_KEY)||"{}");
      if(saved.mode)state.mode=saved.mode;
      if(saved.records)state.records=saved.records;
      if(saved.envelopes)state.envelopes=saved.envelopes;
    }catch(e){}
    var famCode = localStorage.getItem(FAMILY_KEY);
    if(famCode && state.mode==="family")state.familyCode = famCode;
    var n=new Date();
    state.viewMonth=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0");
    if(state.mode==="family"&&state.familyCode){subscribeFamily()}
    render();
  });
}

function saveUserProfile(){
  var u=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initDataUnsafe
    ?window.Telegram.WebApp.initDataUnsafe.user:null;
  if(!u||!u.id)return;
  var now=Date.now();
  var ref=db.ref("users/"+tgId);
  ref.once("value").then(function(snap){
    if(!snap.exists()){
      ref.set({
        name:u.first_name||"Гость",
        username:u.username||"",
        tgId:tgId,
        firstSeen:now,
        lastSeen:now,
        tariff:"trial",
        subStart:now,
        subEnd:now+30*24*60*60*1000,
        status:"active"
      });
    }else{
      ref.update({
        name:u.first_name||"Гость",
        username:u.username||"",
        lastSeen:now
      });
    }
  });
}

setTimeout(saveUserProfile,1500);
  
bootApp();

var tg=window.Telegram&&window.Telegram.WebApp;
if(tg){tg.ready();tg.expand()}

})();
</script>
</body>
</html>
